const EMOJIS = ['😂', '😍', '😎', '😮', '👏', '🙏', '🔥', '🎉'];
function bindVoice() {
  const ptt = $('#vPtt');
  const down = e => { e.preventDefault(); if (!LINK) return; try { ptt.setPointerCapture(e.pointerId); } catch (x) {} LINK.talk(true).then(ok => { if (ok) ptt.classList.add('on'); }); };
  const up = () => { if (!LINK) return; ptt.classList.remove('on'); if (!LINK.openMic) LINK.talk(false); };
  ptt.addEventListener('pointerdown', down); ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(n => ptt.addEventListener(n, up));
  ptt.oncontextmenu = e => e.preventDefault();
  $('#vOpen').onclick = () => { if (!LINK) return; const on = !LINK.openMic; LINK.setOpenMic(on).then(ok => { $('#vOpen').classList.toggle('on', !!(on && ok)); toast(on && ok ? T('openMicOn') : T('openMicOff')); }); };
  $('#vRec').onclick = () => { if (!LINK) return; if (LINK.recording) LINK.recStop(); else LINK.recStart(20); };
  $('#vEmo').onclick = () => {
    const v = $('#voice'), old = v.querySelector('.emo'); if (old) { old.remove(); return; }
    const p = document.createElement('div'); p.className = 'emo';
    p.innerHTML = EMOJIS.map(e => '<button class="e">' + e + '</button>').join('') + ['ph1', 'ph2', 'ph3', 'ph4', 'ph5', 'ph6'].map(k => '<button>' + esc(T(k)) + '</button>').join('');
    p.onclick = e => { const b = e.target.closest('button'); if (!b || !LINK) return; LINK.emoji(b.textContent); p.remove(); const one = b.classList.contains('e'); const V = curView(); if (V && V.me >= 0) bubble(V.me, esc(b.textContent), one ? 'big' : '', one ? 3000 : 4500); };
    v.appendChild(p);

// computer levels per game: [level, text key, stars] — only levels that passed the measurements
function levelsOf(game, cfg, n) {
  const kids = [0, 'lv_kids', '🧸'], easy = [1, 'lv_easy', '⭐'], med = [2, 'lv_med', '⭐⭐'], hard = [3, 'lv_hard', '⭐⭐⭐'], top = [4, 'lv_top', '🏆'];
  if (game === 'sl') return [];
  if (game === 'ludo') { const L = [[0, 'lv_easy', '⭐'], [1, 'lv_med', '⭐⭐'], [2, 'lv_hard', '⭐⭐⭐']]; return (n || 2) === 2 ? L : L.slice(0, 2); }
  if (game === 'c4') return [kids, easy, med, hard, top];
  if (game === 'ttt') return (cfg && cfg.size > 3) ? [kids, easy, med, hard, top] : [kids, easy, med, [3, 'lv_perfect', '🏆']];
  if (game === 'mem') return [[0, 'lv_kids', '🧸'], [1, 'lv_med', '⭐⭐'], [2, 'lv_elephant', '🐘']];
  if (game === 'dots') return [[0, 'lv_easy', '⭐'], [1, 'lv_med', '⭐⭐'], [2, 'lv_hard', '⭐⭐⭐']];
  if (game === 'bs') return [[0, 'lv_kids', '🧸'], [1, 'lv_med', '⭐⭐'], [2, 'lv_hard', '⭐⭐⭐']];
  if (game === 'dom') return [[0, 'lv_kids', '🧸'], [1, 'lv_med', '⭐⭐'], [2, 'lv_hard', '⭐⭐⭐']];
  if (GAMES[game] && GAMES[game].sim) return [[0, 'lv_kids', '🧸'], [1, 'lv_med', '⭐⭐'], [2, 'lv_hard', '⭐⭐⭐']];
  return [];
}

function cfgSummary(game, c) {
  if (!c) return '';
  const f = [];
  if (game === 'sl') { f.push(T('slb_' + c.board)); if (c.bounce) f.push(T('r_bounce')); if (c.six) f.push(T('r_six')); }
  if (game === 'ludo') { f.push(T('opt_tokensN', { n: c.tokens })); SWITCHES.ludo.forEach(([k, t]) => { if (c[k]) f.push(T(t)); }); }
  if (game === 'ttt') f.push(c.size + '×' + c.size);
  if (game === 'dots') f.push(c.size + '×' + c.size);
  if (game === 'mem') f.push(T('cardsN', { n: c.pairs * 2 }), T('set_' + c.set));
  if (game === 'bs') { f.push(c.size + '×' + c.size); SWITCHES.bs.forEach(([k, t]) => { if (c[k]) f.push(T(t)); }); }
  if (game === 'dom') f.push(T('face_' + (c.face || 'dots')));
  if (GAMES[game].sim) { f.push(T('stageN', { n: c.level || 1 })); if (c.ctrl) f.push(T('ctrl_' + c.ctrl)); }
  return f.join(' · ');
}

/* ---------- setup: one phone (people and computers in any mix) ---------- */
function setupOf(game) {
  const E = GAMES[game], S = ST.setup[game] || {};
  const n = Math.max(E.minP, Math.min(E.maxP, S.n || 2));
  const seats = (S.seats || []).slice(0, n);
  while (seats.length < n) seats.push(seats.length === 0 ? { kind: 'human' } : { kind: 'bot' });
  seats.forEach((x, i) => { if (x.kind === 'bot' && x.pe == null) x.pe = (i * 3 + 1) % PERSONAS.length; if (x.kind === 'human' && !x.av) x.av = i === 0 ? myAv() : 1 + (myAv() + i * 5) % AVATARS.length; });
  const lv = levelsOf(game, S.cfg || E.DEF, n).map(l => l[0]);
  return { n, seats, lvl: lv.includes(S.lvl) ? S.lvl : (lv.includes(1) ? 1 : lv[0] || 0), cfg: Object.assign({}, E.DEF, { firstMode: 'rand' }, S.cfg || {}) };
}
function openSetup(game) {
  const E = GAMES[game], S = setupOf(game);
  $('#setupTitle').textContent = GICON[game] + ' ' + gname(game);
  const B = $('#setupBody');
  const save = () => { ST.setup[game] = { n: S.n, seats: S.seats, lvl: S.lvl, cfg: S.cfg }; saveST(); };
  const draw = () => {
    S.seats.forEach((x, i) => { if (i === 0 && x.kind === 'human') { x.name = ST.name; x.av = myAv(); } });
    const allHum = S.seats.every(x => x.kind === 'human'), anyBot = S.seats.some(x => x.kind === 'bot');
    const L = levelsOf(game, S.cfg, S.n);
    if (L.length && !L.some(l => l[0] === S.lvl)) S.lvl = L[Math.min(1, L.length - 1)][0];
    let h = '<div class="mbtns"><button data-mode="cpu"' + (!allHum ? ' class="on"' : '') + '><i>🤖</i>' + T('mCpu') + '</button><button data-mode="hot"' + (allHum ? ' class="on"' : '') + '><i>👨‍👩‍👧</i>' + T('mHot') + '</button></div>';
    h += '<div class="card"><h3>👥 ' + T('players') + '</h3>' + (E.minP !== E.maxP ? '<div class="cnt"><button data-n="-1" aria-label="-">−</button><b class="ltr">' + S.n + '</b><button data-n="1" aria-label="+">+</button></div>' : '') + '<div class="seats" style="margin-top:10px">'
      + S.seats.map((x, i) => {
        const ci = game === 'ludo' ? GAMES.ludo.colorsFor(S.n)[i] : game === 'c4' ? (i ? 2 : 0) : game === 'ttt' ? (i ? 0 : 3) : i;
        const em = avHTML(x.kind === 'bot' ? PERSONAS[x.pe % PERSONAS.length] : avOf(x.av));
        return '<div class="seat" style="--sc:' + PC(ci) + '"><button class="avb" data-av="' + i + '">' + em + '</button>'
          + (x.kind === 'bot' ? '<b>' + esc(T('pe_' + x.pe)) + '<small class="muted" style="display:block;font-weight:400;font-size:12px">' + esc(T('ps_' + x.pe)) + '</small></b>' : '<input data-nm="' + i + '" maxlength="16" placeholder="' + esc(T('player') + ' ' + (i + 1)) + '" value="' + esc(i === 0 ? ST.name : (x.name || '')) + '">')
          + (i === 0 ? '' : '<button class="kind" data-k="' + i + '" aria-label="human / computer">' + (x.kind === 'bot' ? '🤖' : '👤') + '</button>') + '</div>';
      }).join('') + '</div></div>';
    if (anyBot && L.length) h += '<div class="card"><h3>' + T('level') + '</h3><div class="lvls">' + L.map(l => '<button data-l="' + l[0] + '"' + (l[0] === S.lvl ? ' class="on"' : '') + '><span class="st">' + l[2] + '</span><span><b>' + esc(T(l[1])) + '</b><small class="muted" style="display:block;font-size:13px">' + esc(T('lvd_' + game + '_' + l[0] + (game === 'ttt' && S.cfg.size > 3 ? 'b' : ''))) + '</small></span></button>').join('') + '</div>' + (game === 'ludo' && S.n > 2 ? '<p class="muted" style="font-size:12px;margin:8px 0 0">' + T('ludoNote') + '</p>' : '') + '</div>';
    if (anyBot && game === 'sl') h += '<p class="muted" style="font-size:13px;margin:0">🎲 ' + T('slNote') + '</p>';
    h += '<div class="card"><h3>⚙️ ' + T('options') + '</h3><div id="sOpts"></div></div><button class="btn main huge wide" id="sGo">▶️ ' + T('startGame') + '</button>';
    B.innerHTML = h;
    optionsEditor($('#sOpts'), game, S.cfg, S.n, () => { save(); if (game === 'ttt') draw(); });
    B.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => { const hot = b.dataset.mode === 'hot'; S.seats.forEach((x, i) => { if (i) { x.kind = hot ? 'human' : 'bot'; if (x.kind === 'bot' && x.pe == null) x.pe = (i * 3 + 1) % PERSONAS.length; if (!x.av) x.av = 1 + (myAv() + i * 5) % AVATARS.length; } }); save(); draw(); });
    B.querySelectorAll('[data-n]').forEach(b => b.onclick = () => { const k = +b.dataset.n, nn = Math.max(E.minP, Math.min(E.maxP, S.n + k)); if (nn === S.n) return; S.n = nn; while (S.seats.length < nn) { const i = S.seats.length; S.seats.push({ kind: S.seats.some((x, j) => j && x.kind === 'human') && !S.seats.some(x => x.kind === 'bot') ? 'human' : 'bot', pe: (i * 3 + 1) % PERSONAS.length, av: 1 + (myAv() + i * 5) % AVATARS.length }); } S.seats.length = nn; save(); draw(); });
    B.querySelectorAll('[data-k]').forEach(b => b.onclick = () => { const x = S.seats[+b.dataset.k]; x.kind = x.kind === 'bot' ? 'human' : 'bot'; if (x.pe == null) x.pe = (+b.dataset.k * 3 + 1) % PERSONAS.length; if (!x.av) x.av = 1 + (myAv() + +b.dataset.k * 5) % AVATARS.length; save(); draw(); });
    B.querySelectorAll('[data-av]').forEach(b => b.onclick = () => {
      const i = +b.dataset.av, x = S.seats[i];
      if (x.kind === 'bot') { const used = new Set(S.seats.filter(y => y.kind === 'bot').map(y => y.pe)); let k = x.pe; for (let t = 0; t < PERSONAS.length; t++) { k = (k + 1) % PERSONAS.length; if (!used.has(k)) break; } x.pe = k; save(); draw(); return; }
      pickAvatar(x.av, v => { x.av = v; if (i === 0) { ST.avatar = v; } save(); draw(); });
    });
    B.querySelectorAll('[data-nm]').forEach(inp => inp.oninput = () => { const i = +inp.dataset.nm, v = inp.value.trim().slice(0, 16); if (i === 0) { ST.name = v; } else S.seats[i].name = v; save(); });
    B.querySelectorAll('[data-l]').forEach(b => b.onclick = () => { S.lvl = +b.dataset.l; save(); draw(); });
    $('#sGo').onclick = () => {
      save();
      // computers get different characters
      const used = new Set(); S.seats.forEach(x => { if (x.kind !== 'bot') return; let k = x.pe; while (used.has(k)) k = (k + 1) % PERSONAS.length; x.pe = k; used.add(k); });
      const players = S.seats.map((x, i) => x.kind === 'bot' ? { kind: 'bot', lvl: S.lvl, pe: x.pe, av: 1, name: '' } : { kind: 'human', name: i === 0 ? (ST.name || T('you')) : (x.name || T('player') + ' ' + (i + 1)), av: x.av || 1 });
      const cfg = Object.assign({}, S.cfg); cfg.first = cfg.firstMode === 'p1' ? 0 : Math.floor(Math.random() * S.n);
      startLocal(players, cfg, game);
    };
  };
  draw(); show('setup');
}

    + '<div class="card"><h3>' + T('backup') + '</h3><p class="muted" style="font-size:14px">' + T('backupD') + '</p><div class="row"><button class="btn" id="bkOut">⬇️ ' + T('exportB') + '</button><button class="btn" id="bkIn">⬆️ ' + T('importB') + '</button></div><input type="file" id="bkFile" accept="application/json,.json" class="hide"></div>'
    + '<div class="card"><div class="row"><button class="btn" id="stGuide">🧭 ' + T('guide') + '</button><button class="btn" id="stAbout">ℹ️ ' + T('about') + '</button></div></div>'
    + '<button class="btn wide" id="stReset" style="border-color:var(--bad);color:var(--bad)">' + T('resetAll') + '</button>';
  $('#stName').oninput = e => { ST.name = e.target.value.trim().slice(0, 16); saveST(); };
  bindAvGrid($('#stAvs'));
  bindSeg(B, 'lang', v => { ST.lang = v; saveST(); applyLang(); renderSettings(); renderHome(); });
  ['theme', 'mode', 'board'].forEach(k => bindSeg(B, k, v => { ST[k] = v; saveST(); applyLook(); }));
  bindSeg(B, 'speed', v => { ST.speed = v; saveST(); });
  B.querySelectorAll('[data-k]').forEach(c => c.onchange = () => { ST[c.dataset.k] = c.checked; saveST(); });
  $('#bkOut').onclick = exportBackup; $('#bkIn').onclick = () => $('#bkFile').click();
  $('#bkFile').onchange = e => { const f = e.target.files[0]; if (f) importBackup(f); e.target.value = ''; };
  $('#stGuide').onclick = () => openGuide(); $('#stAbout').onclick = () => { renderAbout(); show('about'); };
  $('#stReset').onclick = () => confirmBox(T('resetQ1'), T('resetAll'), () => confirmBox(T('resetQ2'), T('resetYes'), () => { LS.keys().forEach(k => LS.del(k)); location.reload(); }));
}
function exportBackup() {
  const data = { app: 'familynest', v: APP_VERSION, by: ST.name, date: new Date().toISOString(), settings: ST, stats: STATS, replays: REPLAYS, stickers: STK, game: LS.get('game', null) };
  const blob = new Blob([JSON.stringify(data)], { type: 'application/json' }), name = 'familynest-backup-' + new Date().toISOString().slice(0, 10) + '.json';
  const file = typeof File !== 'undefined' ? new File([blob], name, { type: 'application/json' }) : null;
  if (file && navigator.canShare && navigator.canShare({ files: [file] })) { navigator.share({ files: [file], title: 'FamilyNest', text: T('backupBy', { n: ST.name || '' }) }).catch(() => {}); return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500); toast(T('exported'));
}
function importBackup(f) {
  const r = new FileReader();
  r.onload = () => {
    let d; try { d = JSON.parse(r.result); } catch (e) { toast(T('badFile')); return; }
    if (!d || d.app !== 'familynest') { toast(T('badFile')); return; }
    confirmBox(T('importQ', { n: d.by || '?', d: (d.date || '').slice(0, 10) }), T('importB'), () => {
      LS.set('settings', d.settings || {}); LS.set('stats', d.stats || {}); LS.set('replays', d.replays || []); LS.set('stickers', d.stickers || {}); if (d.game) LS.set('game', d.game); else LS.del('game');
      location.reload();
    });
  };
  r.readAsText(f);
}

/* ---------- stats ---------- */
function renderStats() {
  let h = '';
  for (const g of GAME_IDS) {
    const S = STATS[g] || {}, cpu = S.cpu || {}, hot = S.hot || {}, net = S.net || {};
    const tot = (cpu.games || 0) + (hot.games || 0) + (net.games || 0); if (!tot) continue;
    const w = (cpu.wins || 0) + (net.wins || 0), gw = (cpu.games || 0) + (net.games || 0);
    const cells = [['s_games', tot], ['s_wins', w], ['s_winPct', gw ? Math.round(100 * w / gw) + '%' : '—']];
    const sum = k => (cpu[k] || 0) + (hot[k] || 0) + (net[k] || 0);
    if (g === 'sl') cells.push(['s_ups', sum('ups')], ['s_downs', sum('downs')]);
    if (g === 'ludo') cells.push(['s_caps', sum('caps')]);
    if (g === 'dots') cells.push(['s_boxes', sum('boxes')]);
    if (g === 'mem') [6, 8, 10, 12].forEach(p => { if (cpu['best' + p]) cells.push(['s_best', cpu['best' + p] + ' · ' + (p * 2)]); });
    if ((S.cpu || {}).draws || (S.net || {}).draws) cells.push(['s_draws', sum('draws')]);
    const L = levelsOf(g, g === 'ttt' ? { size: 9 } : {}, 2);
    const lt = L.length && cpu.games ? '<table class="sc" style="margin-top:10px"><tr><th>' + T('level') + '</th><th>' + T('s_games') + '</th><th>' + T('s_wins') + '</th></tr>' + L.filter(l => cpu['g' + l[0]]).map(l => '<tr><td>' + l[2] + ' ' + esc(T(l[1])) + '</td><td>' + (cpu['g' + l[0]] || 0) + '</td><td>' + (cpu['w' + l[0]] || 0) + '</td></tr>').join('') + '</table>' : '';
    h += '<div class="card"><h3>' + GICON[g] + ' ' + esc(gname(g)) + '</h3><div class="stat">' + cells.map(c => '<div><b class="ltr">' + c[1] + '</b><span>' + T(c[0]) + '</span></div>').join('') + '</div>' + lt + '</div>';
  }
  $('#statBody').innerHTML = stickerAlbum() + (h || '<div class="card"><p>' + T('noStats') + '</p></div>'); bindAlbum($('#statBody'));
}
function renderReplays() {
  const B = $('#repBody');
  if (!REPLAYS.length) { B.innerHTML = '<div class="card"><p>' + T('noReplays') + '</p></div>'; return; }
  const nm = (r, s) => { const p = r.players[s]; return p ? (p.kind === 'bot' && p.pe >= 0 ? T('pe_' + p.pe) : p.name) : ''; };
  B.innerHTML = REPLAYS.map((r, i) => '<button class="mode" data-rp="' + i + '"><span class="ic">' + (GICON[r.game] || '🎲') + '</span><span><b>' + esc(gname(r.game)) + ' · ' + esc(r.players.map((p, s) => nm(r, s)).join(' · ')) + '</b><span>' + new Date(r.date).toLocaleDateString() + ' · ' + (r.winner >= 0 ? T('winnerIs', { n: esc(nm(r, r.winner)) }) : T('draw')) + '</span></span></button>').join('');
  B.querySelectorAll('[data-rp]').forEach(b => b.onclick = () => openReplay(REPLAYS[+b.dataset.rp]));
}

/* ---------- rules / about / guide ---------- */
function rulesOf(game) {
  const c = Object.assign({}, GAMES[game].DEF, (ST.setup[game] || {}).cfg || {});
  if (game === 'sl') return T('ru_sl', { bounce: c.bounce ? T('ru_sl_bounce') : T('ru_sl_nobounce'), six: c.six ? T('ru_sl_six') : '' });
  if (game === 'ludo') return T('ru_ludo', { exit: c.six2exit ? T('ru_ld_exit6') : T('ru_ld_exit1'), extra: c.extra6 ? T('ru_ld_extra') : '', three: c.three6 && c.extra6 ? T('ru_ld_three') : '', safe: c.safe ? T('ru_ld_safe') : T('ru_ld_nosafe'), exact: c.exact ? T('ru_ld_exact') : T('ru_ld_noexact') });
  if (game === 'bs') return T('ru_bs', { again: c.again ? T('ru_bs_again') : T('ru_bs_noagain'), touch: c.touch ? T('ru_bs_touch') : T('ru_bs_notouch') });
  return T('ru_' + game);
}
function openRules(game, inGame) {
  const list = game ? [game] : GAME_IDS;
  const html = list.map(g => '<div class="rg"><h2>' + GICON[g] + ' ' + esc(gname(g)) + '</h2>' + rulesOf(g) + '</div>').join('');
  if (inGame) { const o = overlay('<div class="rules">' + html + '</div><button class="btn wide" data-x>' + T('close') + '</button>'); o.querySelector('[data-x]').onclick = () => closeOv(o); return; }
  $('#rulesBody').innerHTML = html; show('rules');
}
function renderAbout() {
  $('#aboutBody').innerHTML = '<div class="card" style="text-align:center"><img src="icon-192.png" alt="" width="84" height="84" style="border-radius:20px"><h2 style="margin-top:8px">FamilyNest</h2><p style="margin:2px 0">' + T('subtitle') + '</p><p class="muted ltr">v' + APP_VERSION + '</p></div>'
    + '<div class="card"><div class="sw"><span>' + T('a_ver') + '</span><b class="ltr">' + APP_VERSION + '</b></div><div class="sw"><span>' + T('a_dev') + '</span><b>Barak Aflalo</b></div><div class="sw"><span>' + T('a_plat') + '</span><b class="ltr">PWA · HTML5</b></div><div class="sw"><span>' + T('a_store') + '</span><b>' + T('a_local') + '</b></div><div class="sw"><span>' + T('a_lic') + '</span><b class="ltr">© AppNest 2026</b></div></div>'
    + '<div class="card seats"><a class="btn" href="https://appnest-store.pages.dev" target="_blank" rel="noopener" style="text-align:center;text-decoration:none">🏪 ' + T('a_storeLink') + '</a><button class="btn" id="aShare">📤 ' + T('a_share') + '</button><a class="btn" href="mailto:appnest55@gmail.com?subject=FamilyNest" style="text-align:center;text-decoration:none">✉️ ' + T('a_feedback') + '</a><button class="btn" id="aGuide">🧭 ' + T('guide') + '</button><a class="btn" href="privacy_policy.html" target="_blank" style="text-align:center;text-decoration:none">🔒 ' + T('a_privacy') + '</a></div>'
    + '<div class="card"><p class="muted" style="font-size:14px;margin:0">' + T('a_disc') + '</p></div>';
  $('#aShare').onclick = () => { const d = { title: 'FamilyNest', text: T('shareTxt', { n: ST.name || '' }), url: location.origin + location.pathname }; if (navigator.share) navigator.share(d).catch(() => {}); else (navigator.clipboard ? navigator.clipboard.writeText(d.url) : Promise.reject()).then(() => toast(T('copied'))).catch(() => toast(esc(d.url))); };
  $('#aGuide').onclick = () => openGuide();
}
function openGuide() {
  const steps = [['🎲🐍🔴', 'g1'], ['🤖👨‍👩‍👧', 'g2'], ['💡↩️', 'g3'], ['🌐🎙', 'g4'], ['🎨🏆', 'g5']];
  let i = 0;
  const o = overlay('<div class="guide" id="gBox"></div>');
  const draw = () => {
    o.querySelector('#gBox').innerHTML = '<div class="gbig">' + steps[i][0] + '</div><h2 style="text-align:center;margin-top:8px">' + T(steps[i][1] + 't') + '</h2><p style="font-size:17px;text-align:center">' + T(steps[i][1] + 'd') + '</p>'
      + '<div class="dots">' + steps.map((s, k) => '<i' + (k === i ? ' class="on"' : '') + '></i>').join('') + '</div>'
      + '<div class="row"><button class="btn" data-gd="skip">' + T('skip') + '</button><button class="btn main" data-gd="next">' + (i < steps.length - 1 ? T('next') : T('letsPlay')) + '</button></div>';
  };
  o.onclick = e => { const b = e.target.closest('[data-gd]'); if (!b) return; if (b.dataset.gd === 'next' && i < steps.length - 1) { i++; draw(); } else { ST.guided = true; saveST(); closeOv(o); } };
  draw();
}

/* =====================================================================
   FamilyNest — init (embedded LAST: everything above must already exist)

/* ---- init.js ---- */
(function init() {
  applyLook(); applyLang(); artProbe(() => { if (SCREEN === 'home') renderHome(); }); renderHome();
  $('#mNet').onclick = () => { show('online'); renderNet(); };
  $('#tRules').onclick = () => openRules(null, false);
  $('#tStats').onclick = () => { renderStats(); show('stats'); };
  $('#tReplays').onclick = () => { renderReplays(); show('replays'); };
  $('#tSettings').onclick = () => { renderSettings(); show('settings'); };
  $('#qAbout').onclick = () => { renderAbout(); show('about'); };
  $('#qTheme').onclick = () => { ST.theme = THEMES[(THEMES.indexOf(ST.theme) + 1) % THEMES.length]; saveST(); applyLook(); toast(T('theme') + ': ' + T('th_' + ST.theme), 1200); };
  $('#qMode').onclick = () => { ST.mode = ST.mode === 'day' ? 'night' : 'day'; saveST(); applyLook(); };
  document.addEventListener('click', e => { if (e.target.closest('[data-home]')) goBack(); });
  $('#netBack').onclick = () => goBack();
  bindGame(); bindVoice();
  // browsers block sound until the first tap
  addEventListener('pointerdown', () => { try { if (AC && AC.state === 'suspended') AC.resume(); } catch (e) {} }, { passive: true });
  // an online game saved by an older version that no longer matches → drop it gently (local games are not affected)
  if (NET && NET.G && !GAMES[NET.G.game]) { NET = null; LS.del('net'); }
  // invite link: ?join=CODE
  const q = new URLSearchParams(location.search);
  if (q.get('join')) { if (NET && NET.role === 'guest' && NET.sess && NET.sess.code === q.get('join').toUpperCase()) netResume(); else { NET = null; LS.del('net'); show('online'); renderNet(); } }
  else if (!ST.guided && !q.get('noguide')) openGuide();
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  if ('serviceWorker' in navigator && location.protocol !== 'file:' && !q.get('nosw')) navigator.serviceWorker.register('sw.js').catch(() => {});
  syncHistory();
  window.__fn = { GAMES, FC, UI, get CUR() { return CUR; }, get NET() { return NET; }, get LINK() { return LINK; } };   // for automated tests
})();

</script>
