<!DOCTYPE html>
<html lang="he" dir="rtl" data-theme="gold" data-mode="night" data-board="bright">
<head>
<meta charset="utf-8">

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FamilyNest · כל המשפחה משחקת!</title>
<meta name="description" content="FamilyNest — משחקי משפחה: סולמות ונחשים, לודו, ארבע בשורה, איקס-עיגול, זיכרון ונקודות וקופסאות. מול המחשב, בטלפון אחד או אונליין עם דיבור.">
<meta name="theme-color" content="#0a0a0a">
<meta property="og:title" content="FamilyNest · כל המשפחה משחקת!">
<meta property="og:description" content="שישה משחקי משפחה באפליקציה אחת — מול המחשב, בטלפון אחד או אונליין עם דיבור.">

<link rel="manifest" href="manifest.json">

<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Secular+One&family=Rubik:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
/* ---------------- tokens: app theme (data-theme × data-mode) ---------------- */
:root{
  --bg:#070707; --panel:#121212; --panel2:#1a1a1a; --line:#2c2a24; --ink:#f3efe4; --muted:#a39d8c;
  --acc:#d4a940; --acc2:#f0cd6e; --accInk:#140f02; --ok:#46b46e; --bad:#e0584f;
  /* the four player colours — every player also has an animal, so colour never carries meaning alone */
  --p0:#e8453c; --p1:#2f9e4f; --p2:#f4b81c; --p3:#2f74d8; --p0d:#a8221b; --p1d:#1b6a32; --p2d:#a8790a; --p3d:#1a4d99;
  /* game boards (data-board): a separate setting from the app theme */
  --bd:#fff8ec; --bd2:#ffe9c7; --bdLine:#e0c9a3; --bdInk:#3b2a14; --bdFrame:#7a4e22; --bdShade:rgba(60,35,10,.25);
  --r:14px; --disp:'Secular One','Rubik',system-ui,sans-serif; --body:'Rubik',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
[data-theme="silver"]{--acc:#c9ced6;--acc2:#eef1f5;--accInk:#0d0f12;--line:#2a2d33}
[data-theme="emerald"]{--acc:#3fbf7f;--acc2:#7fe0ae;--accInk:#03140b;--line:#1f3329}
[data-theme="ruby"]{--acc:#e0566a;--acc2:#f598a6;--accInk:#1a0408;--line:#3a2328}
[data-theme="ocean"]{--acc:#4aa8e8;--acc2:#97d0f6;--accInk:#03111c;--line:#1f2d3a}
[data-mode="day"]{--bg:#f4f2ec;--panel:#ffffff;--panel2:#f0ede5;--line:#d9d3c4;--ink:#17150f;--muted:#6b6455}
[data-mode="day"][data-theme="gold"]{--acc:#a8801c;--acc2:#c99b2c;--accInk:#fff}
[data-mode="day"][data-theme="silver"]{--acc:#5c6573;--acc2:#7d8796;--accInk:#fff}
[data-mode="day"][data-theme="emerald"]{--acc:#1f8a55;--acc2:#2ea96b;--accInk:#fff}
[data-mode="day"][data-theme="ruby"]{--acc:#b8344a;--acc2:#d14d62;--accInk:#fff}
[data-mode="day"][data-theme="ocean"]{--acc:#1f6fa8;--acc2:#2f8acb;--accInk:#fff}
/* board styles come after the themes with the same specificity → they win, no !important */
[data-board="bright"]{--bd:#fff8ec;--bd2:#ffe9c7;--bdLine:#e0c9a3;--bdInk:#3b2a14;--bdFrame:#7a4e22;--bdShade:rgba(60,35,10,.25)}
[data-board="pastel"]{--bd:#fbf7ff;--bd2:#ece4fb;--bdLine:#d3c6ec;--bdInk:#40335c;--bdFrame:#8b77b8;--bdShade:rgba(60,40,100,.2);--p0:#f07a73;--p1:#5fbf7f;--p2:#f6cb57;--p3:#6f9fe6}
[data-board="wood"]{--bd:#f3dfb9;--bd2:#e6c690;--bdLine:#c49a5e;--bdInk:#3f2810;--bdFrame:#5a3519;--bdShade:rgba(40,20,5,.3)}
[data-board="contrast"]{--bd:#ffffff;--bd2:#e8e8e8;--bdLine:#000;--bdInk:#000;--bdFrame:#000;--bdShade:rgba(0,0,0,.4);--p0:#ff1f1f;--p1:#00a83a;--p2:#ffc400;--p3:#0055ff;--p0d:#000;--p1d:#000;--p2d:#000;--p3d:#000}
[data-board="theme"]{--bd:var(--panel2);--bd2:var(--panel);--bdLine:var(--line);--bdInk:var(--ink);--bdFrame:var(--acc);--bdShade:rgba(0,0,0,.35)}

body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:16px/1.5 var(--body);-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--acc2);outline-offset:2px}
input,select{font:inherit;color:var(--ink);background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
h1,h2,h3{font-family:var(--disp);font-weight:400;margin:0;line-height:1.15}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}
.muted{color:var(--muted)}
.hide{display:none!important}

/* ---------------- screens ---------------- */
.scr{display:none;min-height:100vh;min-height:100dvh;flex-direction:column}
.scr.on{display:flex;animation:scrIn .18s ease-out}
@keyframes scrIn{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
.bar{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--panel)}
.bar h2{font-size:22px;flex:1}
.back{min-width:48px;height:44px;border-radius:12px;border:1.5px solid var(--acc);background:transparent;color:var(--acc);font-size:20px;font-weight:700}
.wrap{padding:16px;max-width:640px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.card h3{font-size:19px;margin-bottom:8px}
.btn{border:1.5px solid var(--acc);background:transparent;color:var(--acc);border-radius:12px;padding:12px 16px;font-weight:700;min-height:48px}
.btn.main{background:var(--acc);color:var(--accInk);font-size:18px}
.btn.wide{width:100%}
.btn:disabled{opacity:.4;cursor:default}
.btn.small{min-height:38px;padding:6px 12px;font-size:14px}
.btn.huge{min-height:62px;font-size:22px;font-family:var(--disp);font-weight:400;border-radius:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row>*{flex:1}
.seg{display:flex;border:1.5px solid var(--line);border-radius:12px;overflow:hidden;flex-wrap:wrap}
.seg>button{flex:1;border:0;background:transparent;padding:10px 6px;min-height:46px;font-weight:500;color:var(--muted)}
.seg>button.on{background:var(--acc);color:var(--accInk);font-weight:700}
label.f{display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--muted)}
.sw{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}
.sw:last-child{border-bottom:0}
.sw input[type=checkbox]{width:26px;height:26px;accent-color:var(--acc);flex:none}
.sw small{display:block;font-size:13px}
.toast{position:fixed;inset-inline:12px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:90;background:var(--panel);border:1px solid var(--acc);color:var(--ink);padding:12px 16px;border-radius:12px;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.5);opacity:0;transform:translateY(20px);transition:.2s;pointer-events:none}
.toast.on{opacity:1;transform:none}
.badge{text-align:center;font-size:12px;color:var(--muted);padding:18px 0 8px}
.badge b{color:var(--acc);font-weight:700}

/* ---------------- home ---------------- */
#home .hero{padding:58px 18px 4px;text-align:center;position:relative;overflow:hidden}
.floaty{display:flex;justify-content:center;gap:14px;font-size:38px;height:58px;margin-top:8px}
.floaty>span{display:inline-block;animation:bob 3s ease-in-out infinite}
.floaty>span:nth-child(2){animation-delay:.4s}.floaty>span:nth-child(3){animation-delay:.8s}.floaty>span:nth-child(4){animation-delay:1.2s}.floaty>span:nth-child(5){animation-delay:1.6s}
@keyframes bob{50%{transform:translateY(-8px) rotate(-6deg)}}
.wordmark{font-family:var(--disp);font-size:56px;line-height:.95;margin-top:6px;color:var(--ink);letter-spacing:.5px;direction:ltr}
.wordmark i{font-style:normal;color:var(--acc)}
.sub{display:inline-block;margin-top:8px;font-family:var(--disp);font-size:21px;color:var(--accInk);background:var(--acc);padding:2px 14px 4px;border-radius:10px;transform:rotate(-2.5deg)}
.quickset{position:absolute;top:10px;inset-inline-end:12px;display:flex;gap:6px;z-index:2}
.quickset button{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--panel);font-size:18px}
.games{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.gtile{position:relative;border:0;border-radius:20px;padding:10px 10px 12px;min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;color:#fff;overflow:hidden;box-shadow:inset 0 -5px 0 rgba(0,0,0,.22),0 4px 14px rgba(0,0,0,.25);text-align:center}
.gtile:active{transform:scale(.97)}
.gtile .art{width:100%;flex:1;display:grid;place-items:center;min-height:86px}
.gtile .art svg{width:86%;max-width:150px;height:auto;max-height:96px;filter:drop-shadow(0 3px 0 rgba(0,0,0,.18))}
.gtile b{font-family:var(--disp);font-weight:400;font-size:19px;line-height:1.1;text-shadow:0 2px 0 rgba(0,0,0,.25)}
.gtile .np{position:absolute;top:8px;inset-inline-start:8px;background:rgba(0,0,0,.28);border-radius:20px;font-size:12px;padding:1px 8px;font-weight:700}
.gt-sl{background:linear-gradient(160deg,#3fb35f,#1f7a3d)}
.gt-ludo{background:linear-gradient(160deg,#f05a4f,#b8322a)}
.gt-c4{background:linear-gradient(160deg,#3d8bf0,#1d55b8)}
.gt-ttt{background:linear-gradient(160deg,#9b5de5,#6a33b8)}
.gt-mem{background:linear-gradient(160deg,#ff9f43,#d8701a)}
.gt-dots{background:linear-gradient(160deg,#16b6a8,#0b7d73)}
.modes{display:grid;gap:12px}
.mode{display:flex;align-items:center;gap:14px;text-align:start;background:var(--panel);border:1.5px solid var(--line);border-radius:16px;padding:14px 16px;min-height:72px}
.mode .ic{font-size:30px;width:52px;height:52px;display:grid;place-items:center;border-radius:14px;background:var(--panel2);flex:none}
.mode b{display:block;font-size:19px;font-family:var(--disp);font-weight:400}
.mode span{font-size:14px;color:var(--muted)}
.mode.prime{border-color:var(--acc)}
.mode.resume{border-style:dashed;border-color:var(--acc)}
.tools{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tools button{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 4px;min-height:64px;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted)}
.tools button i{font-style:normal;font-size:22px}

/* ---------------- setup ---------------- */
.mbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mbtns>button{border:2px solid var(--line);background:var(--panel2);border-radius:16px;min-height:72px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-weight:700}
.mbtns>button i{font-style:normal;font-size:28px}
.mbtns>button.on{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 18%,var(--panel2))}
.seats{display:flex;flex-direction:column;gap:8px}
.seat{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:14px;background:var(--panel2);border-inline-start:6px solid var(--sc,var(--line))}
.seat>.d{width:10px;height:10px;border-radius:50%;background:var(--ok);flex:none}
.seat>.d.no{background:var(--bad)}
.seat>b{flex:1}
.seat input{flex:1;min-width:0}
.avb{width:46px;height:46px;border-radius:50%;border:2px solid var(--line);background:var(--panel);font-size:26px;display:grid;place-items:center;flex:none;padding:0;line-height:1}
.kind{min-width:52px;height:46px;border-radius:12px;border:1.5px solid var(--line);background:var(--panel);font-size:22px;flex:none}
.cnt{display:flex;align-items:center;gap:12px;justify-content:center}
.cnt>button{width:52px;height:52px;border-radius:50%;border:2px solid var(--acc);background:transparent;color:var(--acc);font-size:26px;font-weight:700}
.cnt>b{font-family:var(--disp);font-size:34px;min-width:40px;text-align:center}
.lvls{display:flex;flex-direction:column;gap:8px}
.lvls>button{display:flex;align-items:center;gap:10px;border:2px solid var(--line);background:var(--panel2);border-radius:14px;padding:8px 12px;min-height:52px;text-align:start}
.lvls>button.on{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 16%,var(--panel2))}
.lvls>button .st{font-size:15px;letter-spacing:1px;flex:none;direction:ltr;min-width:84px}
.lvls>button b{font-weight:700}
.vars{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.vars>button{border:2px solid var(--line);background:var(--panel2);border-radius:14px;padding:6px;display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:700;min-height:64px}
.vars>button.on{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 16%,var(--panel2))}
.vars>button svg{width:100%;height:auto;max-height:110px;border-radius:8px}
.vars>button small{font-weight:400;color:var(--muted);font-size:12px}
.avs{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.avs>button{padding:0;border:3px solid transparent;border-radius:50%;background:var(--panel2);aspect-ratio:1;font-size:24px;line-height:1}
.avs>button.on{border-color:var(--acc)}

/* ---------------- game screen ---------------- */
#game{height:100vh;height:100dvh;min-height:0;overflow:hidden}
#game.on{display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr) auto auto;grid-template-areas:"top" "pl" "board" "act" "voice"}
.gtop{grid-area:top;display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--panel);border-bottom:1px solid var(--line)}
.gtop .back{min-width:42px;height:38px}
.gtop .ttl{flex:1;font-size:13px;color:var(--muted);line-height:1.2;min-width:0}
.gtop .ttl b{display:block;font-family:var(--disp);font-weight:400;color:var(--ink);font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:40px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);font-size:17px;flex:none}
.net{font-size:12px;padding:3px 8px;border-radius:20px;border:1px solid var(--line);white-space:nowrap}
.net.ok{border-color:var(--ok);color:var(--ok)} .net.warn{border-color:var(--bad);color:var(--bad)}
.plist{grid-area:pl;display:flex;gap:6px;padding:6px 8px;background:var(--panel);overflow-x:auto}
.pchip{flex:1 1 0;min-width:0;max-width:220px;display:flex;align-items:center;gap:6px;border:2px solid var(--line);border-radius:14px;padding:4px 6px;background:var(--panel2);position:relative;border-bottom:5px solid var(--pc)}
.pchip.turn{border-color:var(--pc);box-shadow:0 0 0 2px color-mix(in srgb,var(--pc) 40%,transparent);animation:glow 1.4s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 0 5px color-mix(in srgb,var(--pc) 25%,transparent)}}
.pchip .em{font-size:24px;line-height:1;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--pc);flex:none;box-shadow:inset 0 -3px 0 rgba(0,0,0,.2)}
.pchip .nm{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;line-height:1.15}
.pchip .nm small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.pchip .off{color:var(--bad);font-size:11px}
.pchip .sc{margin-inline-start:auto;font:400 20px/1 var(--disp);flex:none;padding-inline-start:4px}
.plist.many .pchip{flex-direction:column;gap:1px;padding:3px 2px;text-align:center}
.plist.many .pchip .nm{font-size:11px;max-width:100%}
.plist.many .pchip .sc{margin:0;font-size:16px;padding:0}
.plist.many .pchip .em{width:28px;height:28px;font-size:20px}
.bwrap{grid-area:board;position:relative;display:flex;align-items:center;justify-content:center;min-height:0;overflow:hidden;padding:6px;background:radial-gradient(ellipse at 50% 40%,color-mix(in srgb,var(--acc) 10%,var(--bg)),var(--bg) 75%)}
.bd{position:relative;flex:none;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.bd>svg.base{position:absolute;inset:0;width:100%;height:100%;display:block}
.status{position:absolute;top:6px;inset-inline:6px;display:flex;justify-content:center;pointer-events:none;z-index:6}
.status>span{background:rgba(0,0,0,.62);color:#fff;font-size:15px;padding:3px 14px;border-radius:20px;max-width:100%;text-align:center}
.gact{grid-area:act;display:flex;gap:8px;padding:8px 10px;background:var(--panel);align-items:center;border-top:1px solid var(--line)}
.gact .btn{min-height:56px;padding:6px 10px}
.gact .grow{flex:1}
.dieBtn{flex:1;display:flex;align-items:center;justify-content:center;gap:12px;border-radius:18px;border:0;min-height:64px;background:var(--dc,var(--acc));color:#fff;font:400 23px/1 var(--disp);box-shadow:inset 0 -5px 0 rgba(0,0,0,.25);text-shadow:0 2px 0 rgba(0,0,0,.25)}
.dieBtn:disabled{filter:saturate(.35) brightness(.75);cursor:default}
.dieBtn.go{animation:wiggle 1.2s ease-in-out infinite}
@keyframes wiggle{0%,100%{transform:none}10%{transform:rotate(-3deg) scale(1.03)}20%{transform:rotate(3deg) scale(1.03)}30%{transform:none}}
.dieBtn svg{width:46px;height:46px;flex:none;filter:drop-shadow(0 3px 2px rgba(0,0,0,.35))}
.dieBtn svg.rolling{animation:tumble .5s linear}
@keyframes tumble{0%{transform:rotate(0) scale(1)}50%{transform:rotate(200deg) scale(1.25)}100%{transform:rotate(360deg) scale(1)}}
.voice{grid-area:voice;display:flex;gap:6px;padding:6px 10px calc(6px + env(safe-area-inset-bottom,0px));background:var(--panel2);border-top:1px solid var(--line);align-items:center;position:relative}
.voice .btn{min-height:44px;padding:6px 10px;font-size:14px}
.ptt{flex:1.6;user-select:none;-webkit-user-select:none;touch-action:none}
.ptt.on{background:var(--ok)!important;color:#000!important;border-color:var(--ok)!important}
.vbtn.on{background:var(--acc);color:var(--accInk)}
.rec.on{background:var(--bad);color:#fff;border-color:var(--bad)}
.emo{position:absolute;bottom:100%;inset-inline:8px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;z-index:40;box-shadow:0 -6px 24px rgba(0,0,0,.4)}
.emo>button{border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:6px 10px;font-size:15px;min-height:40px}
.emo>button.e{font-size:22px;padding:4px 8px}
#bubbles{position:fixed;inset:0;pointer-events:none;z-index:55}
.bubble{position:absolute;max-width:min(80vw,320px);background:#fffaf0;color:#111;border-radius:12px;padding:5px 10px;font-size:14px;font-weight:500;box-shadow:0 4px 14px rgba(0,0,0,.4);animation:pop .25s ease-out}
.bubble.big{font-size:32px;padding:0 6px;background:transparent;box-shadow:none}
.bubble.mine{background:var(--acc2);color:var(--accInk)}
.bubble.vm{pointer-events:auto;background:var(--acc);color:var(--accInk)}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
/* big "your turn" banner + win stamp */
.banner{position:absolute;inset:0;display:flex;justify-content:center;align-items:flex-start;padding-top:9%;pointer-events:none;z-index:20}
.banner>div{font-family:var(--disp);font-size:min(9vw,44px);color:#fff;background:var(--pc,var(--acc));padding:6px 26px 10px;border-radius:24px;box-shadow:0 8px 0 rgba(0,0,0,.25),0 12px 30px rgba(0,0,0,.4);animation:bannerIn 1.1s ease-out both;text-align:center;line-height:1.1;max-width:92%}
.banner>div small{display:block;font-size:.45em;opacity:.9}
@keyframes bannerIn{0%{transform:scale(.3) rotate(-8deg);opacity:0}18%{transform:scale(1.12) rotate(2deg);opacity:1}30%{transform:scale(1) rotate(0)}80%{opacity:1}100%{opacity:0;transform:scale(1.05)}}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:70;overflow:hidden}
.confetti>i{position:absolute;top:-20px;width:10px;height:14px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(var(--rot));opacity:.9}}
/* landscape: board on one side, controls on the other */
@media (orientation:landscape) and (max-height:560px){
  #game.on{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto auto;grid-template-areas:"top top" "board pl" "board act" "board voice"}
  .plist{flex-direction:column;overflow-y:auto;border-inline-start:1px solid var(--line)}
  .pchip{max-width:none;flex:0 0 auto}
  .plist.many .pchip{flex-direction:row;text-align:start;padding:3px 6px;gap:6px}
  .plist.many .pchip .sc{margin-inline-start:auto}
  .gact,.voice{border-inline-start:1px solid var(--line)}
}

/* ---------------- tokens (all games) ---------------- */
.tok{position:absolute;width:var(--ts);height:var(--ts);margin-left:calc(var(--ts)/-2);margin-top:calc(var(--ts)/-2);border-radius:50%;background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--pc) 55%,#fff),var(--pc) 55%,var(--pcd) 100%);
  box-shadow:0 0 0 calc(var(--ts)*.07) #fff,0 calc(var(--ts)*.12) calc(var(--ts)*.18) rgba(0,0,0,.45);display:grid;place-items:center;font-size:calc(var(--ts)*.58);line-height:1;z-index:5;pointer-events:none;transition:transform .15s}
.tok.mv{animation:mvPulse 1s ease-in-out infinite;z-index:7}
@keyframes mvPulse{50%{box-shadow:0 0 0 calc(var(--ts)*.07) #fff,0 0 0 calc(var(--ts)*.2) color-mix(in srgb,var(--pc) 70%,transparent),0 4px 8px rgba(0,0,0,.45)}}
.tok.hintt{box-shadow:0 0 0 calc(var(--ts)*.1) #59c3ff,0 0 14px #59c3ff}
.tok.hopping{z-index:9}
.tok.sel{transform:scale(1.18)}

/* ---------------- snakes & ladders ---------------- */
.sl-num{font:700 22px var(--body);fill:var(--bdInk);opacity:.55}
/* ---------------- ludo ---------------- */
/* ---------------- connect four ---------------- */
.bd-c4{background:linear-gradient(#dbe9ff,#bcd5fb);border-radius:14px}
[data-board="contrast"] .bd-c4{background:#fff}
[data-board="theme"] .bd-c4{background:var(--panel2)}
.c4-frame{position:absolute;inset:0}
.c4-disc{position:absolute;border-radius:50%;background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--pc) 50%,#fff),var(--pc) 58%,var(--pcd));box-shadow:inset 0 -4px 0 rgba(0,0,0,.2);z-index:1;display:grid;place-items:center;font-size:calc(var(--cs)*.42)}
.c4-disc.win{animation:winPulse .7s ease-in-out infinite;z-index:3}
@keyframes winPulse{50%{transform:scale(.86);filter:brightness(1.3)}}
.c4-hover{position:absolute;border-radius:50%;opacity:.55;z-index:4;pointer-events:none}
.c4-hint{position:absolute;border:4px dashed #59c3ff;border-radius:14px;z-index:4;pointer-events:none;animation:pop .3s}
/* ---------------- tic-tac-toe ---------------- */
.tt-mark{position:absolute;pointer-events:none;z-index:2}
.tt-mark path,.tt-mark circle{fill:none;stroke-linecap:round}
.tt-mark.draw path,.tt-mark.draw circle{stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:ink .28s ease-out forwards}
.tt-mark.draw path+path{animation-delay:.14s}
@keyframes ink{to{stroke-dashoffset:0}}
.tt-ghost{position:absolute;z-index:3;pointer-events:none;border-radius:12%;animation:pop .2s}
/* ---------------- memory ---------------- */
.mm-card{position:absolute;perspective:600px}
.mm-in{position:absolute;inset:0;transition:transform .35s;transform-style:preserve-3d}
.mm-card.up .mm-in{transform:rotateY(180deg)}
.mm-f,.mm-b{position:absolute;inset:0;border-radius:14%;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:grid;place-items:center;box-shadow:0 3px 0 rgba(0,0,0,.2),0 4px 10px rgba(0,0,0,.25)}
.mm-b{background:repeating-linear-gradient(45deg,var(--acc) 0 8px,color-mix(in srgb,var(--acc) 70%,#000) 8px 16px);border:3px solid #fff}
.mm-b::after{content:'?';font:400 calc(var(--cw)*.5)/1 var(--disp);color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.3)}
.mm-f{transform:rotateY(180deg);background:#fff;font-size:calc(var(--cw)*.6);line-height:1;border:4px solid var(--oc,#fff)}
.mm-card.got .mm-f{animation:gotIt .6s ease-out}
@keyframes gotIt{40%{transform:rotateY(180deg) scale(1.15)}}
.mm-card.miss .mm-f{animation:missIt .4s}
@keyframes missIt{25%{transform:rotateY(180deg) translateX(-5px)}75%{transform:rotateY(180deg) translateX(5px)}}
/* ---------------- dots & boxes ---------------- */
.dt-tap{cursor:pointer}

.ov{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;padding:14px}
.ov>.box{background:var(--panel);border:1px solid var(--acc);border-radius:18px;max-width:560px;width:100%;max-height:calc(100dvh - 28px);overflow:auto;padding:18px}
.ov h2{font-size:26px;margin-bottom:6px}
.res{display:flex;flex-direction:column;gap:8px;margin:12px 0}
.rp{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;padding:8px 10px;background:var(--panel2);border-inline-start:6px solid var(--pc)}
.rp.win{border-color:var(--ok);border-inline-start-color:var(--pc)}
.rp .em{font-size:26px}
.rp b{flex:1}
.rp .pl{font:400 22px var(--disp)}
.trophy{font-size:72px;text-align:center;line-height:1;animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
table.sc{width:100%;border-collapse:collapse;font-size:14px}
table.sc th,table.sc td{border-bottom:1px solid var(--line);padding:6px 4px;text-align:center}
table.sc th{color:var(--muted);font-weight:500}
.code{font-family:var(--disp);font-size:52px;letter-spacing:6px;color:var(--acc);text-align:center;direction:ltr}
.gpick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.gpick>button{border:2px solid var(--line);background:var(--panel2);border-radius:14px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13px;font-weight:700;min-height:74px}
.gpick>button i{font-style:normal;font-size:28px}
.gpick>button.on{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 16%,var(--panel2))}
.guide .dots{display:flex;gap:6px;justify-content:center;margin:12px 0}
.guide .dots>i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.guide .dots>i.on{background:var(--acc)}
.guide .gbig{font-size:64px;text-align:center;line-height:1.1}
.rules p,.rules li{line-height:1.65}
.rules h3{color:var(--acc);margin-top:6px}
.rules .rg{border:1px solid var(--line);border-radius:14px;padding:4px 14px 10px;margin-bottom:12px;background:var(--panel)}
.rules .rg>h2{font-size:22px;margin:8px 0 2px}
.rv .rbd{display:flex;justify-content:center;margin:8px 0}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stat>div{background:var(--panel2);border-radius:12px;padding:8px 4px}
.stat b{display:block;font-family:var(--disp);font-size:24px;font-weight:400;color:var(--acc)}
.stat span{font-size:12px;color:var(--muted)}
.persona{text-align:center}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.fast *{animation-duration:0s!important;transition-duration:0s!important}

<script>
/* ---- nestlink.js ---- */
/* =====================================================================
   NestLink 1.1 — AppNest online multiplayer module (WebRTC via PeerJS)
   One file, drop into any AppNest game. No server of our own:
   - a public PeerJS server only introduces the phones; game data, voice
     and voice messages then travel directly phone-to-phone.
   - star layout: the host is seat 0 and relays messages between guests,
     so 2–6 players work; voice is a direct mesh (good up to ~4–5).
   - every game message is sequenced and re-sent after a reconnect.
   The game owns the session object (persist it with the game state) and
   receives events through callbacks. See NESTLINK.md for the API.
   1.1: sendTo(seat, d) — a private message to one seat only (card games:
        the host deals each player only their own cards). Compatible with 1.0.
        Heartbeat: a phone that vanished (app closed, no signal) is marked offline
        within ~10 s instead of looking connected forever.
        After a reconnect, if the other side already got more messages than we
        remember sending (we restored an older saved session), numbering continues
        after theirs instead of being silently ignored.
   ===================================================================== */
const NestLink = (() => {
  const CDNS = ['https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js', 'https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js', 'https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.5/peerjs.min.js'];
  const ICE = [{ urls: 'stun:stun.l.google.com:19302' }, { urls: 'stun:stun1.l.google.com:19302' }, { urls: 'stun:stun.cloudflare.com:3478' }];
  const AB = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
  const genCode = (n = 5) => Array.from({ length: n }, () => AB[Math.floor(Math.random() * AB.length)]).join('');
  const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
  function loadScript(u) { return new Promise((res, rej) => { const s = document.createElement('script'); s.src = u; s.onload = res; s.onerror = rej; document.head.appendChild(s); setTimeout(rej, 12000); }); }
  async function loadPeer() { if (window.Peer) return true; for (const u of CDNS) { try { await loadScript(u); if (window.Peer) return true; } catch (e) {} } return false; }
  const b64 = buf => { let s = '', a = new Uint8Array(buf); for (let i = 0; i < a.length; i += 0x8000) s += String.fromCharCode.apply(null, a.subarray(i, i + 0x8000)); return btoa(s); };
  const unb64 = s => { const b = atob(s), a = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) a[i] = b.charCodeAt(i); return a; };

  function create(opt) {
    const L = { status: 'off', lastErr: null, peer: null, conns: {}, retry: null, chunks: {}, calls: {}, audio: {}, mic: null, talking: false, openMic: false, rec: null, seen: {}, hb: {}, hbT: null };
    let S = null;                                         // the session — owned and persisted by the game
    const ev = (k, ...a) => { try { opt[k] && opt[k](...a); } catch (e) { console.error(e); } };
    const persist = () => ev('persist', S);
    const roomId = c => (opt.app || 'nest') + '-v1-' + c.toLowerCase();
    const max = () => opt.maxPlayers || 2;
    const isHost = () => S && S.role === 'host';
    function peerOpts() {
      const q = new URLSearchParams(location.search), o = { debug: 0, config: { iceServers: opt.iceServers || ICE } };
      if (q.get('peerhost')) { o.host = q.get('peerhost'); o.port = +(q.get('peerport') || 9000); o.path = '/'; o.secure = false; }   // test servers only
      return o;
    }
    function setStatus(st, err) { L.status = st; if (err !== undefined) L.lastErr = err; ev('onStatus', st, L.lastErr); }
    const link = seat => S.links[seat] || (S.links[seat] = { seq: 0, lastIn: 0, out: [] });
    const rosterEntry = seat => S.roster.find(p => p.seat === seat);
    function rawTo(seat, m) { const c = L.conns[seat]; try { if (c && c.open) c.send(m); } catch (e) {} }
    function rawAll(m, except) { for (const s in L.conns) if (+s !== except) rawTo(+s, m); }

    /* ---------- starting ---------- */
    async function start(session) {
      close(true); S = session; persist();
      L.hbT = setInterval(beat, 3000);                   // after close(), which clears it
      setStatus('connecting');
      if (!(await loadPeer())) { setStatus('error', 'load'); return false; }
      const peer = L.peer = new Peer(isHost() ? roomId(S.code) : undefined, peerOpts());
      peer.on('open', id => {
        S.pid = id; if (isHost()) { const me = rosterEntry(0); if (me) { me.pid = id; me.online = true; } }
        persist(); setStatus(isHost() ? 'waiting' : 'connecting'); if (!isHost()) connectHost();
      });
      peer.on('connection', c => { if (isHost()) attach(c, null); });
      peer.on('call', onCall);
      peer.on('disconnected', () => setTimeout(() => { try { if (L.peer === peer && !peer.destroyed) peer.reconnect(); } catch (e) {} }, 1500));
      peer.on('error', e => {
        const t = e && e.type;
        if (t === 'unavailable-id') {                     // room id still held (e.g. after reload) — new code while nobody joined, else retry
          if (S.roster.length < 2) { S.code = genCode(); persist(); ev('onCode', S.code); }
          setTimeout(() => start(S), S.roster.length < 2 ? 300 : 4000); return;
        }
        if (t === 'peer-unavailable') { setStatus('notfound', 'nf'); scheduleRetry(); return; }
        if (/network|server-error|socket/.test(t || '')) setStatus('error', 'net');
      });
      return true;
    }
    function host(code) {
      return start({ role: 'host', code: code || genCode(), seat: 0, cid: uid(), roster: [{ seat: 0, name: opt.name ? opt.name() : '', online: true, cid: null, voice: false }], links: {} });
    }
    function join(code) { return start({ role: 'guest', code: code.toUpperCase(), seat: null, cid: uid(), roster: [], links: {} }); }
    function resume(session) { return start(session); }
    function scheduleRetry() { clearTimeout(L.retry); if (S && !isHost() && !(L.conns[0] && L.conns[0].open)) L.retry = setTimeout(connectHost, 3000); }
    function connectHost() { if (!L.peer || L.peer.destroyed || (L.conns[0] && L.conns[0].open)) return; attach(L.peer.connect(roomId(S.code), { reliable: true, serialization: 'json' }), 0); scheduleRetry(); }

    /* ---------- connections ---------- */
    function attach(c, seat) {
      let mySeat = seat;                                  // the seat at the other end of this connection
      const onOpen = () => {
        if (!isHost()) { L.conns[0] = c; rawTo(0, { t: 'hi', cid: S.cid, name: opt.name ? opt.name() : '', have: link(0).lastIn, v: opt.version, hb: 1 }); }
      };
      if (c.open) onOpen(); else c.on('open', onOpen);
      c.on('data', m => {
        if (!m || !m.t) return;
        const key = isHost() ? mySeat : 0;                // 1.1 heartbeat: remember when we last heard from them
        if (key != null) L.seen[key] = Date.now();
        if (m.t === 'ping') { if (key != null) L.hb[key] = 1; return; }
        if (isHost() && m.t === 'hi') {                   // a guest introduces itself → give it a seat (same seat when it comes back)
          let p = S.roster.find(x => x.cid === m.cid);
          if (!p) {
            if (S.roster.length >= max()) { try { c.send({ t: 'full' }); c.close(); } catch (e) {} return; }
            let s = 1; while (S.roster.some(x => x.seat === s)) s++;
            p = { seat: s, cid: m.cid, name: '', online: true, voice: false }; S.roster.push(p); S.roster.sort((a, b) => a.seat - b.seat);
            ev('onJoin', s);
          }
          mySeat = p.seat; p.name = (m.name || '').slice(0, 20); p.online = true; p.pid = c.peer;
          if ((m.have || 0) > link(mySeat).seq) link(mySeat).seq = m.have;   // 1.1: we restored an older session — keep numbering after what they already got
          if (L.conns[mySeat] && L.conns[mySeat] !== c) { try { L.conns[mySeat].close(); } catch (e) {} }
          L.conns[mySeat] = c; L.seen[mySeat] = Date.now(); L.hb[mySeat] = m.hb ? 1 : 0;   // 1.1 phones announce the heartbeat
          rawTo(mySeat, { t: 'hi', seat: mySeat, have: link(mySeat).lastIn, roster: S.roster, v: opt.version, hb: 1 });
          link(mySeat).out.filter(x => x.seq > (m.have || 0)).forEach(x => rawTo(mySeat, x));
          if (m.v && opt.version && m.v.split('.')[0] !== opt.version.split('.')[0]) ev('onVersion', m.v);
          persist(); broadcastRoster(); setStatus('open'); callEveryone();
          return;
        }
        if (!isHost() && m.t === 'hi') {
          S.seat = m.seat; S.roster = m.roster || []; L.seen[0] = Date.now(); L.hb[0] = m.hb ? 1 : 0;
          if ((m.have || 0) > link(0).seq) link(0).seq = m.have;            // 1.1: same protection on the guest side
          persist();
          link(0).out.filter(x => x.seq > (m.have || 0)).forEach(x => rawTo(0, x));
          if (m.v && opt.version && m.v.split('.')[0] !== opt.version.split('.')[0]) ev('onVersion', m.v);
          clearTimeout(L.retry); setStatus('open'); ev('onRoster', S.roster); callEveryone(); return;
        }
        if (m.t === 'full') { setStatus('full', 'full'); close(true); return; }
        onData(m, isHost() ? mySeat : 0);
      });
      const gone = () => {
        if (isHost()) { if (mySeat == null || L.conns[mySeat] !== c) return; delete L.conns[mySeat]; const p = rosterEntry(mySeat); if (p) p.online = false; persist(); broadcastRoster(); setStatus(Object.keys(L.conns).length ? 'open' : 'waiting'); }
        else { if (L.conns[0] !== c) return; delete L.conns[0]; setStatus('reconnecting'); scheduleRetry(); }
        stopAudioFrom(mySeat);
      };
      c.on('close', gone); c.on('error', gone);
    }
    function broadcastRoster() { if (!isHost()) return; rawAll({ t: 'roster', roster: S.roster }); ev('onRoster', S.roster); }

    /* ---------- messages ---------- */
    function onData(m, via) {
      if (m.t === 'roster') { S.roster = m.roster; persist(); ev('onRoster', S.roster); callEveryone(); return; }
      if (m.t === 'need') { link(via).out.filter(x => x.seq > m.have).forEach(x => rawTo(via, x)); return; }
      if (m.t === 'emo' || m.t === 'talk' || m.t === 'vm') {
        if (isHost()) rawAll(m, via);                     // relay to the other guests
        if (m.t === 'emo') ev('onEmoji', m.e, m.from);
        else if (m.t === 'talk') { const p = rosterEntry(m.from); if (p) p.talking = m.on; ev('onTalk', m.from, m.on); }

/* ---- core.js ---- */
/* =====================================================================
   FamilyNest core — shared engine helpers. Pure: no DOM. Runs in Node too.
   Every game registers GAMES[id] with the same interface:
     newGame(players, cfg, seed) → G        apply(G, seat, action) → {ok}
     legal(G) → [actions]                   view(G, seat) → V (only what that seat may know)
     ai(V or G, lvl) → action               DEF (default cfg), minP, maxP
   G holds its own random state (G.r), so  seed + actions  replays every state.
   ===================================================================== */
const GAMES = {};
const FC = (() => {
  function rnd(G) {                                       // mulberry32, state kept in the game
    let t = (G.r = (G.r + 0x6D2B79F5) >>> 0);
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }

  const newSeed = () => { try { const a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] >>> 0; } catch (e) { return (Math.random() * 4294967296) >>> 0; } };

  function base(game, players, cfg, seed) {
    const n = players.length;
    return {
      game, cfg, seed: seed >>> 0, r: seed >>> 0, n: 0,
      players: players.map(p => ({ name: p.name || '', kind: p.kind || 'human', lvl: p.lvl == null ? 1 : p.lvl, av: p.av || 1, pe: p.pe == null ? -1 : p.pe, wins: p.wins || 0 })),
      turn: ((cfg.first || 0) % n + n) % n, over: false, winner: null, ev: [], evn: 0, acts: []
    };
  }
  function ev(G, o) { o.i = ++G.evn; G.ev.push(o); if (G.ev.length > 60) G.ev.splice(0, G.ev.length - 60); return o; }
  function apply(G, s, a) {
    const E = GAMES[G.game]; if (!E || G.over) return { ok: false };
    let r; try { r = E.apply(G, s, a); } catch (e) { r = { ok: false, err: String(e) }; }
    if (r && r.ok) { G.acts.push([s, a]); G.n++; }
    return r || { ok: false };
  }

  function pub(G, extraHidden) {
    const V = {};
    for (const k in G) { if (k === 'r' || k === 'seed' || k === 'acts' || (extraHidden && extraHidden.includes(k))) continue; V[k] = G[k]; }
    return JSON.parse(JSON.stringify(V));

  function view(G, seat) { const E = GAMES[G.game]; const V = E.view ? E.view(G, seat) : pub(G); V.me = seat; return V; }

  function frames(rec) {
    const E = GAMES[rec.game], G = E.newGame(rec.players, rec.cfg, rec.seed), out = [JSON.parse(JSON.stringify(G))];
    for (const [s, a] of rec.acts) { const r = apply(G, s, a); if (!r.ok) break; out.push(JSON.parse(JSON.stringify(G))); }
    return out;
  }
  const clone = o => JSON.parse(JSON.stringify(o));
  const pick = a => a[Math.floor(Math.random() * a.length)];
  return { rnd, die, newSeed, shuffle, base, ev, apply, pub, view, frames, clone, pick };
})();

/* ---- g_snakes.js ---- */
/* =====================================================================
   Snakes & Ladders — 2–4 players, 10×10, four boards with their own layouts.
   House rule (on by default): you must land on 100 exactly; a bigger roll
   bounces back from 100 by the extra steps (and a snake there still bites).
   Optional: a 6 gives another roll. No decisions → no computer levels.
   ===================================================================== */
GAMES.sl = (() => {
  // up = ladders / vines / rockets / candy canes · down = snakes / slides / black holes
  const BOARDS = {
    classic: { up: { 4: 25, 13: 46, 33: 49, 42: 63, 50: 69, 62: 81, 74: 92 }, down: { 27: 5, 40: 3, 43: 18, 54: 31, 66: 45, 76: 58, 89: 53, 99: 41 } },
    jungle: { up: { 3: 22, 8: 30, 28: 55, 58: 77, 71: 91, 80: 98 }, down: { 17: 7, 36: 14, 48: 26, 62: 19, 87: 24, 93: 73, 95: 75 } },
    space: { up: { 2: 23, 15: 44, 21: 42, 36: 57, 51: 72, 67: 88, 78: 97 }, down: { 31: 9, 47: 16, 56: 37, 69: 33, 83: 61, 96: 76, 99: 24 } },
    candy: { up: { 6: 27, 11: 31, 20: 59, 35: 65, 46: 85, 71: 90 }, down: { 25: 5, 34: 12, 49: 30, 73: 53, 88: 67, 94: 72, 98: 78 } }
  };
  const DEF = { board: 'classic', bounce: true, six: false };
  const links = cfg => { const B = BOARDS[cfg.board] || BOARDS.classic; return Object.assign({}, B.up, B.down); };
  function newGame(players, cfg, seed) {
    cfg = Object.assign({}, DEF, cfg);
    const G = FC.base('sl', players, cfg, seed);
    G.pos = players.map(() => 0); G.last = 0; G.rolls = players.map(() => 0); G.ups = players.map(() => 0); G.downs = players.map(() => 0);
    return G;
  }
  function apply(G, s, a) {
    if (G.over || s !== G.turn || !a || !a.roll) return { ok: false };
    const v = FC.die(G), from = G.pos[s], n = G.players.length; G.last = v; G.rolls[s]++;
    FC.ev(G, { e: 'roll', s, v });
    let to = from + v; const path = [];
    if (to > 100) {
      if (G.cfg.bounce) { for (let c = from + 1; c <= 100; c++) path.push(c); to = 200 - to; for (let c = 99; c >= to; c--) path.push(c); }
      else to = from;
    } else for (let c = from + 1; c <= to; c++) path.push(c);
    if (path.length) FC.ev(G, { e: 'move', s, path, bounce: from + v > 100 });
    else FC.ev(G, { e: 'stay', s, need: 100 - from });
    const L = links(G.cfg);
    if (L[to] != null) { const t2 = L[to], up = t2 > to; FC.ev(G, { e: up ? 'up' : 'down', s, from: to, to: t2 }); if (up) G.ups[s]++; else G.downs[s]++; to = t2; }
    G.pos[s] = to;
    if (to === 100) { G.over = true; G.winner = s; FC.ev(G, { e: 'win', s }); return { ok: true }; }
    if (G.cfg.six && v === 6) FC.ev(G, { e: 'again', s });
    else G.turn = (s + 1) % n;
    return { ok: true };
  }
  const legal = G => G.over ? [] : [{ roll: 1 }];
  const ai = () => ({ roll: 1 });
  return { id: 'sl', minP: 2, maxP: 4, DEF, BOARDS, links, newGame, apply, legal, ai, levels: 0 };
})();

/* ---- g_ludo.js ---- */
/* =====================================================================
   Ludo ("פרה פרה") — 2–4 players, classic cross board.
   Token progress: -1 = in the yard · 0..50 = on the track (0 = own start square)

   Track square (absolute) = (colour·13 + progress) mod 52.
   House rules (all switches): 6 to leave the yard · 6 = another roll ·
   three 6s in a row lose the turn · landing on a rival sends it back to the yard ·
   safe squares (start squares + stars) · finish only with the exact number.
   ===================================================================== */

/* =====================================================================

  return {
    get(k, d) { try { const v = ok ? localStorage.getItem(P + k) : mem[k]; return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { const s = JSON.stringify(v); try { if (ok) localStorage.setItem(P + k, s); else mem[k] = s; return true; } catch (e) { toast(T('saveFail')); return false; } },
    del(k) { try { if (ok) localStorage.removeItem(P + k); else delete mem[k]; } catch (e) {} },
    keys() { const out = []; try { if (ok) for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k.startsWith(P)) out.push(k.slice(P.length)); } else out.push(...Object.keys(mem)); } catch (e) {} return out; }

})();

    const click = (at, vol, f) => { const n = AC.createBuffer(1, AC.sampleRate * .03 | 0, AC.sampleRate), d = n.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 4); const s = AC.createBufferSource(); s.buffer = n; const b = AC.createBiquadFilter(); b.type = 'bandpass'; b.frequency.value = f || 1800; b.Q.value = 2; const g = AC.createGain(); g.gain.value = vol; s.connect(b); b.connect(g); g.connect(AC.destination); s.start(t + at); };
    switch (kind) {

   cx = { mine, hint, ghost, last } from the controller.

const UI = {};
const SVGNS = 'http://www.w3.org/2000/svg';
const pct = v => (v * 100).toFixed(3) + '%';
function tokEl(el, key, ci, emoji) {
  let t = el.querySelector('.tok[data-k="' + key + '"]');
  if (!t) { t = document.createElement('div'); t.className = 'tok'; t.dataset.k = key; el.appendChild(t); }
  t.style.cssText = t.style.cssText.replace(/--pc[^;]*;?|--pcd[^;]*;?/g, '') + ';' + pcStyle(ci);
  if (t.textContent !== emoji) t.textContent = emoji;
  return t;
}
function placeTok(t, x, y) { t.style.left = pct(x); t.style.top = pct(y); t._x = x; t._y = y; }
// move a token through points [[x,y],…] (board fractions); hop = little jump on each point
function glide(t, pts, ms, hop) {
  if (!pts.length) return Promise.resolve();
  const end = pts[pts.length - 1];
  if (FAST || !t.animate) { placeTok(t, end[0], end[1]); return Promise.resolve(); }
  const from = [t._x == null ? pts[0][0] : t._x, t._y == null ? pts[0][1] : t._y];

      let h = el.querySelector('.c4-hint'); if (cx.hint && cx.hint.c != null) { if (!h) { h = document.createElement('div'); h.className = 'c4-hint'; el.appendChild(h); } const cs = cell(el); h.style.cssText = 'left:' + (cx.hint.c * cs) + 'px;top:0;width:' + cs + 'px;height:' + el.clientHeight + 'px'; } else if (h) h.remove();
    },
    async anim(el, V, evs) {

/* ================= Tic-tac-toe family ================= */
UI.ttt = (() => {
  const geo = el => el.clientWidth;
  function grid(V) {
    const n = V.cfg.size, u = 100 / n; let g = svg('rect', { x: 0, y: 0, width: 100, height: 100, rx: n === 3 ? 6 : 3, fill: 'var(--bd)' });
    if (n > 3) for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if ((r + c) % 2) g += svg('rect', { x: c * u, y: r * u, width: u, height: u, fill: 'var(--bd2)', opacity: .6 });
    const w = n === 3 ? 2.6 : .7;
    for (let i = 1; i < n; i++) g += svg('line', { x1: i * u, y1: n === 3 ? 4 : 0, x2: i * u, y2: n === 3 ? 96 : 100, stroke: 'var(--bdLine)', 'stroke-width': w, 'stroke-linecap': 'round' }) + svg('line', { y1: i * u, x1: n === 3 ? 4 : 0, y2: i * u, x2: n === 3 ? 96 : 100, stroke: 'var(--bdLine)', 'stroke-width': w, 'stroke-linecap': 'round' });
    return '<svg class="base" viewBox="0 0 100 100" aria-hidden="true">' + g + '</svg><svg class="base tt-layer" viewBox="0 0 100 100" style="z-index:2;pointer-events:none"></svg>';
  }

    if (s === 0) return '<g class="tt-mark ' + (cls || '') + '" style="--len:' + (r * 2.9).toFixed(1) + '">' + svg('path', { d: 'M' + (cx - r) + ',' + (cy - r) + ' L' + (cx + r) + ',' + (cy + r), stroke: PC(ci), 'stroke-width': w }) + svg('path', { d: 'M' + (cx + r) + ',' + (cy - r) + ' L' + (cx - r) + ',' + (cy + r), stroke: PC(ci), 'stroke-width': w }) + '</g>';
    return '<g class="tt-mark ' + (cls || '') + '" style="--len:' + (2 * Math.PI * r).toFixed(1) + '">' + svg('circle', { cx, cy, r, stroke: PC(ci), 'stroke-width': w }) + '</g>';
  }
  function layer(el, V, cx, fresh) {
    const n = V.cfg.size, u = 100 / n; let h = '';
    V.b.forEach((v, x) => { if (v) h += mark(V, x, v - 1, fresh === x ? 'draw' : ''); });
    if (n > 3 && V.last >= 0 && !V.line) { const x = V.last; h += svg('circle', { cx: (x % n) * u + u / 2, cy: ((x / n) | 0) * u + u * .88, r: u * .07, fill: 'var(--bdInk)', opacity: .55 }); }
    if (cx && cx.ghost != null && !V.b[cx.ghost]) { const x = cx.ghost; h += svg('rect', { x: (x % n) * u + .5, y: ((x / n) | 0) * u + .5, width: u - 1, height: u - 1, rx: u * .15, fill: 'var(--acc2)', opacity: .35, stroke: 'var(--acc)', 'stroke-width': .8 }) + '<g opacity=".55">' + mark(V, x, V.turn, '') + '</g>'; }
    if (cx && cx.hint && cx.hint.x != null) { const x = cx.hint.x; h += svg('rect', { x: (x % n) * u + 1, y: ((x / n) | 0) * u + 1, width: u - 2, height: u - 2, rx: u * .15, fill: 'none', stroke: '#59c3ff', 'stroke-width': n === 3 ? 1.6 : .9, 'stroke-dasharray': '3 2' }); }
    if (V.line) { const a = V.line[0], b = V.line[V.line.length - 1]; h += svg('line', { x1: (a % n) * u + u / 2, y1: ((a / n) | 0) * u + u / 2, x2: (b % n) * u + u / 2, y2: ((b / n) | 0) * u + u / 2, stroke: '#fff', 'stroke-width': n === 3 ? 5 : 2.4, 'stroke-linecap': 'round', opacity: .85, class: 'tt-win' }); }
    el.querySelector('.tt-layer').innerHTML = h;

    mount(el, V) { el.innerHTML = grid(V); this.draw(el, V); },
    size() {},
    draw(el, V, cx) { layer(el, V, cx || this._cx || {}); },
    async anim(el, V, evs, cx) {
      for (const e of evs) if (e.e === 'place') { beep('place'); layer(el, Object.assign({}, V, { line: null }), cx, e.x); await wait(300 * SPEED()); }

      for (let x = 0; x < n * n; x++) { if (V.b[x]) continue; const d = Math.hypot(fx - ((x % n) + .5), fy - (((x / n) | 0) + .5)); if (d < bd) { bd = d; best = x; } }

const MEM_SETS = {

  food: ['🍎', '🍌', '🍇', '🍓', '🍉', '🍒', '🍕', '🍩', '🍪', '🧁', '🍦', '🥕'],
  ride: ['🚗', '🚕', '🚌', '🚓', '🚑', '🚒', '🚜', '🚲', '🚀', '✈️', '🚁', '⛵'],
  sea: ['🐠', '🐙', '🦀', '🐳', '🐬', '🦈', '🐢', '🦑', '🐚', '🦞', '🐡', '⭐']

UI.mem = (() => {
  function dims(n, el) {
    const W = el ? el.parentNode.clientWidth : 360, H = el ? el.parentNode.clientHeight : 640; let best = [4, n / 4], bs = 0;
    for (let c = 2; c <= 8; c++) { if (n % c) continue; const r = n / c, s = Math.min(W / c, H / r); if (s > bs) { bs = s; best = [c, r]; } }
    return best;

  const sym = (V, v) => (MEM_SETS[V.cfg.set] || MEM_SETS.animals)[v] || '❔';
  return {
    aspect(V, el) { const [c, r] = dims(V.cards.length, el); return c / r; },
    color: (V, s) => s,
    chip: (V, s) => '<span class="ltr">' + V.score[s] + '</span>',
    mount(el, V) {
      const n = V.cards.length, [c, r] = dims(n, el); el._dims = [c, r]; let h = '';
      for (let i = 0; i < n; i++) h += '<div class="mm-card" data-i="' + i + '"><div class="mm-in"><div class="mm-b"></div><div class="mm-f"></div></div></div>';
      el.innerHTML = h; this.size(el); this.draw(el, V);
    },
    size(el) {
      const [c, r] = el._dims || [4, 4], W = el.clientWidth, H = el.clientHeight, gap = Math.max(4, W * .018), cw = Math.min((W - gap * (c - 1)) / c, (H - gap * (r - 1)) / r);
      el.style.setProperty('--cw', cw + 'px');
      el.querySelectorAll('.mm-card').forEach(d => { const i = +d.dataset.i, x = i % c, y = (i / c) | 0; d.style.cssText = 'left:' + (x * (cw + gap)) + 'px;top:' + (y * (cw + gap)) + 'px;width:' + cw + 'px;height:' + cw + 'px'; });
    },
    draw(el, V) {
      el.querySelectorAll('.mm-card').forEach(d => {
        const i = +d.dataset.i, v = V.cards[i], up = v != null, own = V.own[i];
        d.classList.toggle('up', up); d.classList.remove('miss');
        const f = d.querySelector('.mm-f'); if (up && f.textContent !== sym(V, v)) f.textContent = sym(V, v);

        if (e.e === 'flip') { const d = card(e.i); if (d && e.v != null) { d.querySelector('.mm-f').textContent = sym(V, e.v); d.querySelector('.mm-f').style.setProperty('--oc', '#fff'); d.classList.add('up'); } beep('flip'); await wait(380 * SPEED()); }
        else if (e.e === 'match') { e.cards.forEach(i => { const d = card(i); if (d) { d.classList.add('got'); d.querySelector('.mm-f').style.setProperty('--oc', PC(e.s)); setTimeout(() => d.classList.remove('got'), 700); } }); beep('match'); bubbleSeat(e.s, '✨', 'big', 1200); await wait(450 * SPEED()); }
        else if (e.e === 'miss') { e.cards.forEach(i => { const d = card(i); if (d) d.classList.add('miss'); }); beep('miss'); await wait(300 * SPEED()); }
        else if (e.e === 'hide') { e.cards.forEach(i => { const d = card(i); if (d) d.classList.remove('up', 'miss'); }); await wait(360 * SPEED()); }

    },
    tap(el, V, pt) {

/* ================= Dots & Boxes ================= */
UI.dots = (() => {
  const M = .42;
  function seg(g, l) { if (l < g.NH) { const r = (l / g.w) | 0, c = l % g.w; return [c, r, c + 1, r]; } const k = l - g.NH, r = (k / (g.w + 1)) | 0, c = k % (g.w + 1); return [c, r, c, r + 1]; }
  function art(V) { const n = V.cfg.size; return '<svg class="base" viewBox="' + (-M) + ' ' + (-M) + ' ' + (n + 2 * M) + ' ' + (n + 2 * M) + '" aria-hidden="true">' + svg('rect', { x: -M, y: -M, width: n + 2 * M, height: n + 2 * M, rx: .3, fill: 'var(--bd)' }) + '<g class="dt-layer"></g></svg>'; }
  function layer(el, V, cx, freshL, freshB) {

    V.box.forEach((o, b) => { if (o < 0) return; const r = (b / n) | 0, c = b % n; h += '<g' + (freshB && freshB.includes(b) ? ' style="transform-origin:' + (c + .5) + 'px ' + (r + .5) + 'px;animation:pop .35s"' : '') + '>' + svg('rect', { x: c + .07, y: r + .07, width: .86, height: .86, rx: .12, fill: PC(o), opacity: .82 }) + svg('text', { x: c + .5, y: r + .66, 'text-anchor': 'middle', 'font-size': .46 }, pemoji(V, o)) + '</g>'; });
    for (let l = 0; l < g.NL; l++) {
      const [x1, y1, x2, y2] = seg(g, l), o = V.lines[l];
      if (o < 0) h += svg('line', { x1, y1, x2, y2, stroke: 'var(--bdLine)', 'stroke-width': .05, 'stroke-dasharray': '.08 .1', 'stroke-linecap': 'round' });
      else h += svg('line', Object.assign({ x1, y1, x2, y2, stroke: PC(o), 'stroke-width': l === V.last ? .15 : .12, 'stroke-linecap': 'round' }, l === freshL ? { 'stroke-dasharray': '1', 'stroke-dashoffset': '1', style: 'animation:ink .25s ease-out forwards' } : {}));
    }
    if (cx && cx.ghost != null && V.lines[cx.ghost] < 0) { const [x1, y1, x2, y2] = seg(g, cx.ghost); h += svg('line', { x1, y1, x2, y2, stroke: 'var(--acc)', 'stroke-width': .16, 'stroke-linecap': 'round', opacity: .6 }); }
    if (cx && cx.hint && cx.hint.l != null) { const [x1, y1, x2, y2] = seg(g, cx.hint.l); h += svg('line', { x1, y1, x2, y2, stroke: '#59c3ff', 'stroke-width': .2, 'stroke-linecap': 'round', opacity: .7, 'stroke-dasharray': '.1 .08' }); }
    for (let r = 0; r <= n; r++) for (let c = 0; c <= n; c++) h += svg('circle', { cx: c, cy: r, r: .085, fill: 'var(--bdInk)' });

  return {
    aspect: () => 1, seg,
    color: (V, s) => s,
    chip: (V, s) => '<span class="ltr">' + V.score[s] + '</span>',
    mount(el, V) { el.innerHTML = art(V); this.draw(el, V); },
    size() {},
    draw(el, V, cx) { layer(el, V, cx || this._cx || {}); },
    async anim(el, V, evs, cx) {
      for (const e of evs) if (e.e === 'line') { beep(e.boxes.length ? 'box' : 'line'); layer(el, V, cx, e.l, e.boxes); await wait((e.boxes.length ? 380 : 230) * SPEED()); }

/* =====================================================================

  if (L && sayBye && hostSide()) { L.send({ type: 'bye' }); setTimeout(() => L.close(), 400); } else if (L) L.close();
  LINK = null; NET = null; LS.del('net');
  if (CUR && CUR.mode === 'net') CUR = null;
}
function netResume() {
  if (!NET || !NET.sess) return false;
  netInit(); LINK.resume(NET.sess);
  if (NET.role === 'host' && NET.G) { newCur('net', NET.G, { id: NET.gid }); closeAllOv(); show('game'); after(); }

  else { show('online'); renderNet(); }
  return true;
}

const GICON = { sl: '🐍', ludo: '🎲', c4: '🔴', ttt: '❌', mem: '🃏', dots: '⬜' };
// computer levels per game: [level, text key, stars] — only levels that passed the measurements
function levelsOf(game, cfg, n) {
  const kids = [0, 'lv_kids', '🧸'], easy = [1, 'lv_easy', '⭐'], med = [2, 'lv_med', '⭐⭐'], hard = [3, 'lv_hard', '⭐⭐⭐'], top = [4, 'lv_top', '🏆'];
  if (game === 'sl') return [];
  if (game === 'ludo') { const L = [[0, 'lv_easy', '⭐'], [1, 'lv_med', '⭐⭐'], [2, 'lv_hard', '⭐⭐⭐']]; return (n || 2) === 2 ? L : L.slice(0, 2); }
  if (game === 'c4') return [kids, easy, med, hard, top];
  if (game === 'ttt') return (cfg && cfg.size > 3) ? [kids, easy, med, hard, top] : [kids, easy, med, [3, 'lv_perfect', '🏆']];
  if (game === 'mem') return [[0, 'lv_kids', '🧸'], [1, 'lv_med', '⭐⭐'], [2, 'lv_elephant', '🐘']];
  if (game === 'dots') return [[0, 'lv_easy', '⭐'], [1, 'lv_med', '⭐⭐'], [2, 'lv_hard', '⭐⭐⭐']];
  return [];
}

    el.innerHTML = h;
    el.querySelectorAll('[data-b]').forEach(b => b.onclick = () => { cfg.board = b.dataset.b; draw(); ch(); });
    ['tokens', 'size', 'pairs'].forEach(k => bindSeg(el, k, v => { cfg[k] = +v; draw(); ch(); }));

function cfgSummary(game, c) {
  if (!c) return '';
  const f = [];
  if (game === 'sl') { f.push(T('slb_' + c.board)); if (c.bounce) f.push(T('r_bounce')); if (c.six) f.push(T('r_six')); }
  if (game === 'ludo') { f.push(T('opt_tokensN', { n: c.tokens })); SWITCHES.ludo.forEach(([k, t]) => { if (c[k]) f.push(T(t)); }); }
  if (game === 'ttt') f.push(c.size + '×' + c.size);
  if (game === 'dots') f.push(c.size + '×' + c.size);
  if (game === 'mem') f.push(T('cardsN', { n: c.pairs * 2 }), T('set_' + c.set));
  return f.join(' · ');
}

/* ---------- setup: one phone (people and computers in any mix) ---------- */
function setupOf(game) {
  const E = GAMES[game], S = ST.setup[game] || {};
  const n = Math.max(E.minP, Math.min(E.maxP, S.n || 2));
  const seats = (S.seats || []).slice(0, n);
  while (seats.length < n) seats.push(seats.length === 0 ? { kind: 'human' } : { kind: 'bot' });
  seats.forEach((x, i) => { if (x.kind === 'bot' && x.pe == null) x.pe = (i * 3 + 1) % PERSONAS.length; if (x.kind === 'human' && !x.av) x.av = i === 0 ? myAv() : 1 + (myAv() + i * 5) % AVATARS.length; });
  const lv = levelsOf(game, S.cfg || E.DEF, n).map(l => l[0]);
  return { n, seats, lvl: lv.includes(S.lvl) ? S.lvl : (lv.includes(1) ? 1 : lv[0] || 0), cfg: Object.assign({}, E.DEF, { firstMode: 'rand' }, S.cfg || {}) };
}
function openSetup(game) {
  const E = GAMES[game], S = setupOf(game);
  $('#setupTitle').textContent = GICON[game] + ' ' + gname(game);
  const B = $('#setupBody');
  const save = () => { ST.setup[game] = { n: S.n, seats: S.seats, lvl: S.lvl, cfg: S.cfg }; saveST(); };
  const draw = () => {
    S.seats.forEach((x, i) => { if (i === 0 && x.kind === 'human') { x.name = ST.name; x.av = myAv(); } });
    const allHum = S.seats.every(x => x.kind === 'human'), anyBot = S.seats.some(x => x.kind === 'bot');
    const L = levelsOf(game, S.cfg, S.n);
    if (L.length && !L.some(l => l[0] === S.lvl)) S.lvl = L[Math.min(1, L.length - 1)][0];
    let h = '<div class="mbtns"><button data-mode="cpu"' + (!allHum ? ' class="on"' : '') + '><i>🤖</i>' + T('mCpu') + '</button><button data-mode="hot"' + (allHum ? ' class="on"' : '') + '><i>👨‍👩‍👧</i>' + T('mHot') + '</button></div>';
    h += '<div class="card"><h3>👥 ' + T('players') + '</h3>' + (E.minP !== E.maxP ? '<div class="cnt"><button data-n="-1" aria-label="-">−</button><b class="ltr">' + S.n + '</b><button data-n="1" aria-label="+">+</button></div>' : '') + '<div class="seats" style="margin-top:10px">'
      + S.seats.map((x, i) => {
        const ci = game === 'ludo' ? GAMES.ludo.colorsFor(S.n)[i] : game === 'c4' ? (i ? 2 : 0) : game === 'ttt' ? (i ? 0 : 3) : i;
        const em = x.kind === 'bot' ? PERSONAS[x.pe % PERSONAS.length] : avOf(x.av);
        return '<div class="seat" style="--sc:' + PC(ci) + '"><button class="avb" data-av="' + i + '">' + em + '</button>'
          + (x.kind === 'bot' ? '<b>' + esc(T('pe_' + x.pe)) + '<small class="muted" style="display:block;font-weight:400;font-size:12px">' + esc(T('ps_' + x.pe)) + '</small></b>' : '<input data-nm="' + i + '" maxlength="16" placeholder="' + esc(T('player') + ' ' + (i + 1)) + '" value="' + esc(i === 0 ? ST.name : (x.name || '')) + '">')
          + (i === 0 ? '' : '<button class="kind" data-k="' + i + '" aria-label="human / computer">' + (x.kind === 'bot' ? '🤖' : '👤') + '</button>') + '</div>';
      }).join('') + '</div></div>';
    if (anyBot && L.length) h += '<div class="card"><h3>' + T('level') + '</h3><div class="lvls">' + L.map(l => '<button data-l="' + l[0] + '"' + (l[0] === S.lvl ? ' class="on"' : '') + '><span class="st">' + l[2] + '</span><span><b>' + esc(T(l[1])) + '</b><small class="muted" style="display:block;font-size:13px">' + esc(T('lvd_' + game + '_' + l[0] + (game === 'ttt' && S.cfg.size > 3 ? 'b' : ''))) + '</small></span></button>').join('') + '</div>' + (game === 'ludo' && S.n > 2 ? '<p class="muted" style="font-size:12px;margin:8px 0 0">' + T('ludoNote') + '</p>' : '') + '</div>';
    if (anyBot && game === 'sl') h += '<p class="muted" style="font-size:13px;margin:0">🎲 ' + T('slNote') + '</p>';
    h += '<div class="card"><h3>⚙️ ' + T('options') + '</h3><div id="sOpts"></div></div><button class="btn main huge wide" id="sGo">▶️ ' + T('startGame') + '</button>';
    B.innerHTML = h;
    optionsEditor($('#sOpts'), game, S.cfg, S.n, () => { save(); if (game === 'ttt') draw(); });
    B.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => { const hot = b.dataset.mode === 'hot'; S.seats.forEach((x, i) => { if (i) { x.kind = hot ? 'human' : 'bot'; if (x.kind === 'bot' && x.pe == null) x.pe = (i * 3 + 1) % PERSONAS.length; if (!x.av) x.av = 1 + (myAv() + i * 5) % AVATARS.length; } }); save(); draw(); });
    B.querySelectorAll('[data-n]').forEach(b => b.onclick = () => { const k = +b.dataset.n, nn = Math.max(E.minP, Math.min(E.maxP, S.n + k)); if (nn === S.n) return; S.n = nn; while (S.seats.length < nn) { const i = S.seats.length; S.seats.push({ kind: S.seats.some((x, j) => j && x.kind === 'human') && !S.seats.some(x => x.kind === 'bot') ? 'human' : 'bot', pe: (i * 3 + 1) % PERSONAS.length, av: 1 + (myAv() + i * 5) % AVATARS.length }); } S.seats.length = nn; save(); draw(); });
    B.querySelectorAll('[data-k]').forEach(b => b.onclick = () => { const x = S.seats[+b.dataset.k]; x.kind = x.kind === 'bot' ? 'human' : 'bot'; if (x.pe == null) x.pe = (+b.dataset.k * 3 + 1) % PERSONAS.length; if (!x.av) x.av = 1 + (myAv() + +b.dataset.k * 5) % AVATARS.length; save(); draw(); });
    B.querySelectorAll('[data-av]').forEach(b => b.onclick = () => {
      const i = +b.dataset.av, x = S.seats[i];
      if (x.kind === 'bot') { const used = new Set(S.seats.filter(y => y.kind === 'bot').map(y => y.pe)); let k = x.pe; for (let t = 0; t < PERSONAS.length; t++) { k = (k + 1) % PERSONAS.length; if (!used.has(k)) break; } x.pe = k; save(); draw(); return; }
      pickAvatar(x.av, v => { x.av = v; if (i === 0) { ST.avatar = v; } save(); draw(); });
    });
    B.querySelectorAll('[data-nm]').forEach(inp => inp.oninput = () => { const i = +inp.dataset.nm, v = inp.value.trim().slice(0, 16); if (i === 0) { ST.name = v; } else S.seats[i].name = v; save(); });
    B.querySelectorAll('[data-l]').forEach(b => b.onclick = () => { S.lvl = +b.dataset.l; save(); draw(); });
    $('#sGo').onclick = () => {
      save();
      // computers get different characters
      const used = new Set(); S.seats.forEach(x => { if (x.kind !== 'bot') return; let k = x.pe; while (used.has(k)) k = (k + 1) % PERSONAS.length; x.pe = k; used.add(k); });
      const players = S.seats.map((x, i) => x.kind === 'bot' ? { kind: 'bot', lvl: S.lvl, pe: x.pe, av: 1, name: '' } : { kind: 'human', name: i === 0 ? (ST.name || T('you')) : (x.name || T('player') + ' ' + (i + 1)), av: x.av || 1 });
      const cfg = Object.assign({}, S.cfg); cfg.first = cfg.firstMode === 'p1' ? 0 : Math.floor(Math.random() * S.n);
      startLocal(players, cfg, game);
    };
  };
  draw(); show('setup');
}

    + '<div class="card"><h3>' + T('look') + '</h3><label class="f">' + T('theme') + segHTML('theme', THEMES.map(t => [t, T('th_' + t)]), ST.theme) + '</label>'
    + '<label class="f" style="margin-top:10px">' + T('dayNight') + segHTML('mode', [['night', '🌙 ' + T('night')], ['day', '☀️ ' + T('day')]], ST.mode) + '</label>'

    + '<div class="card"><h3>' + T('gameplay') + '</h3>'
    + '<label class="f">' + T('speed') + segHTML('speed', [['slow', '🐢 ' + T('sp_slow')], ['normal', T('sp_normal')], ['fast', '🐇 ' + T('sp_fast')]], ST.speed) + '</label>'
    + [['autoMove', 'autoMove', 'autoMoveD'], ['confirmBig', 'confirmBig', 'confirmBigD'], ['sound', 'sound'], ['vib', 'vibrate']].map(([k, t, d]) => '<div class="sw"><span>' + T(t) + (d ? '<small class="muted">' + T(d) + '</small>' : '') + '</span><input type="checkbox" data-k="' + k + '"' + (ST[k] ? ' checked' : '') + '></div>').join('') + '</div>'
    + '<div class="card"><h3>' + T('backup') + '</h3><p class="muted" style="font-size:14px">' + T('backupD') + '</p><div class="row"><button class="btn" id="bkOut">⬇️ ' + T('exportB') + '</button><button class="btn" id="bkIn">⬆️ ' + T('importB') + '</button></div><input type="file" id="bkFile" accept="application/json,.json" class="hide"></div>'
    + '<div class="card"><div class="row"><button class="btn" id="stGuide">🧭 ' + T('guide') + '</button><button class="btn" id="stAbout">ℹ️ ' + T('about') + '</button></div></div>'
    + '<button class="btn wide" id="stReset" style="border-color:var(--bad);color:var(--bad)">' + T('resetAll') + '</button>';
  $('#stName').oninput = e => { ST.name = e.target.value.trim().slice(0, 16); saveST(); };
  bindAvGrid($('#stAvs'));
  bindSeg(B, 'lang', v => { ST.lang = v; saveST(); applyLang(); renderSettings(); renderHome(); });
  ['theme', 'mode', 'board'].forEach(k => bindSeg(B, k, v => { ST[k] = v; saveST(); applyLook(); }));
  bindSeg(B, 'speed', v => { ST.speed = v; saveST(); });
  B.querySelectorAll('[data-k]').forEach(c => c.onchange = () => { ST[c.dataset.k] = c.checked; saveST(); });
  $('#bkOut').onclick = exportBackup; $('#bkIn').onclick = () => $('#bkFile').click();
  $('#bkFile').onchange = e => { const f = e.target.files[0]; if (f) importBackup(f); e.target.value = ''; };
  $('#stGuide').onclick = () => openGuide(); $('#stAbout').onclick = () => { renderAbout(); show('about'); };
  $('#stReset').onclick = () => confirmBox(T('resetQ1'), T('resetAll'), () => confirmBox(T('resetQ2'), T('resetYes'), () => { LS.keys().forEach(k => LS.del(k)); location.reload(); }));
}
function exportBackup() {
  const data = { app: 'familynest', v: APP_VERSION, by: ST.name, date: new Date().toISOString(), settings: ST, stats: STATS, replays: REPLAYS, game: LS.get('game', null) };
  const blob = new Blob([JSON.stringify(data)], { type: 'application/json' }), name = 'familynest-backup-' + new Date().toISOString().slice(0, 10) + '.json';
  const file = typeof File !== 'undefined' ? new File([blob], name, { type: 'application/json' }) : null;
  if (file && navigator.canShare && navigator.canShare({ files: [file] })) { navigator.share({ files: [file], title: 'FamilyNest', text: T('backupBy', { n: ST.name || '' }) }).catch(() => {}); return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500); toast(T('exported'));
}
function importBackup(f) {
  const r = new FileReader();
  r.onload = () => {
    let d; try { d = JSON.parse(r.result); } catch (e) { toast(T('badFile')); return; }
    if (!d || d.app !== 'familynest') { toast(T('badFile')); return; }
    confirmBox(T('importQ', { n: d.by || '?', d: (d.date || '').slice(0, 10) }), T('importB'), () => {
      LS.set('settings', d.settings || {}); LS.set('stats', d.stats || {}); LS.set('replays', d.replays || []); if (d.game) LS.set('game', d.game); else LS.del('game');
      location.reload();
    });
  };
  r.readAsText(f);
}

/* ---------- stats ---------- */
function renderStats() {
  let h = '';
  for (const g of GAME_IDS) {
    const S = STATS[g] || {}, cpu = S.cpu || {}, hot = S.hot || {}, net = S.net || {};
    const tot = (cpu.games || 0) + (hot.games || 0) + (net.games || 0); if (!tot) continue;
    const w = (cpu.wins || 0) + (net.wins || 0), gw = (cpu.games || 0) + (net.games || 0);
    const cells = [['s_games', tot], ['s_wins', w], ['s_winPct', gw ? Math.round(100 * w / gw) + '%' : '—']];
    const sum = k => (cpu[k] || 0) + (hot[k] || 0) + (net[k] || 0);
    if (g === 'sl') cells.push(['s_ups', sum('ups')], ['s_downs', sum('downs')]);
    if (g === 'ludo') cells.push(['s_caps', sum('caps')]);
    if (g === 'dots') cells.push(['s_boxes', sum('boxes')]);
    if (g === 'mem') [6, 8, 10, 12].forEach(p => { if (cpu['best' + p]) cells.push(['s_best', cpu['best' + p] + ' · ' + (p * 2)]); });
    if ((S.cpu || {}).draws || (S.net || {}).draws) cells.push(['s_draws', sum('draws')]);
    const L = levelsOf(g, g === 'ttt' ? { size: 9 } : {}, 2);
    const lt = L.length && cpu.games ? '<table class="sc" style="margin-top:10px"><tr><th>' + T('level') + '</th><th>' + T('s_games') + '</th><th>' + T('s_wins') + '</th></tr>' + L.filter(l => cpu['g' + l[0]]).map(l => '<tr><td>' + l[2] + ' ' + esc(T(l[1])) + '</td><td>' + (cpu['g' + l[0]] || 0) + '</td><td>' + (cpu['w' + l[0]] || 0) + '</td></tr>').join('') + '</table>' : '';
    h += '<div class="card"><h3>' + GICON[g] + ' ' + esc(gname(g)) + '</h3><div class="stat">' + cells.map(c => '<div><b class="ltr">' + c[1] + '</b><span>' + T(c[0]) + '</span></div>').join('') + '</div>' + lt + '</div>';
  }
  $('#statBody').innerHTML = h || '<div class="card"><p>' + T('noStats') + '</p></div>';
}
function renderReplays() {
  const B = $('#repBody');
  if (!REPLAYS.length) { B.innerHTML = '<div class="card"><p>' + T('noReplays') + '</p></div>'; return; }
  const nm = (r, s) => { const p = r.players[s]; return p ? (p.kind === 'bot' && p.pe >= 0 ? T('pe_' + p.pe) : p.name) : ''; };
  B.innerHTML = REPLAYS.map((r, i) => '<button class="mode" data-rp="' + i + '"><span class="ic">' + (GICON[r.game] || '🎲') + '</span><span><b>' + esc(gname(r.game)) + ' · ' + esc(r.players.map((p, s) => nm(r, s)).join(' · ')) + '</b><span>' + new Date(r.date).toLocaleDateString() + ' · ' + (r.winner >= 0 ? T('winnerIs', { n: esc(nm(r, r.winner)) }) : T('draw')) + '</span></span></button>').join('');
  B.querySelectorAll('[data-rp]').forEach(b => b.onclick = () => openReplay(REPLAYS[+b.dataset.rp]));
}

/* ---------- rules / about / guide ---------- */
function rulesOf(game) {
  const c = Object.assign({}, GAMES[game].DEF, (ST.setup[game] || {}).cfg || {});
  if (game === 'sl') return T('ru_sl', { bounce: c.bounce ? T('ru_sl_bounce') : T('ru_sl_nobounce'), six: c.six ? T('ru_sl_six') : '' });
  if (game === 'ludo') return T('ru_ludo', { exit: c.six2exit ? T('ru_ld_exit6') : T('ru_ld_exit1'), extra: c.extra6 ? T('ru_ld_extra') : '', three: c.three6 && c.extra6 ? T('ru_ld_three') : '', safe: c.safe ? T('ru_ld_safe') : T('ru_ld_nosafe'), exact: c.exact ? T('ru_ld_exact') : T('ru_ld_noexact') });
  return T('ru_' + game);
}
function openRules(game, inGame) {
  const list = game ? [game] : GAME_IDS;
  const html = list.map(g => '<div class="rg"><h2>' + GICON[g] + ' ' + esc(gname(g)) + '</h2>' + rulesOf(g) + '</div>').join('');
  if (inGame) { const o = overlay('<div class="rules">' + html + '</div><button class="btn wide" data-x>' + T('close') + '</button>'); o.querySelector('[data-x]').onclick = () => closeOv(o); return; }
  $('#rulesBody').innerHTML = html; show('rules');
}
function renderAbout() {
  $('#aboutBody').innerHTML = '<div class="card" style="text-align:center"><img src="icon-192.png" alt="" width="84" height="84" style="border-radius:20px"><h2 style="margin-top:8px">FamilyNest</h2><p style="margin:2px 0">' + T('subtitle') + '</p><p class="muted ltr">v' + APP_VERSION + '</p></div>'
    + '<div class="card"><div class="sw"><span>' + T('a_ver') + '</span><b class="ltr">' + APP_VERSION + '</b></div><div class="sw"><span>' + T('a_dev') + '</span><b>Barak Aflalo</b></div><div class="sw"><span>' + T('a_plat') + '</span><b class="ltr">PWA · HTML5</b></div><div class="sw"><span>' + T('a_store') + '</span><b>' + T('a_local') + '</b></div><div class="sw"><span>' + T('a_lic') + '</span><b class="ltr">© AppNest 2026</b></div></div>'
    + '<div class="card seats"><a class="btn" href="https://appnest-store.pages.dev" target="_blank" rel="noopener" style="text-align:center;text-decoration:none">🏪 ' + T('a_storeLink') + '</a><button class="btn" id="aShare">📤 ' + T('a_share') + '</button><a class="btn" href="mailto:appnest55@gmail.com?subject=FamilyNest" style="text-align:center;text-decoration:none">✉️ ' + T('a_feedback') + '</a><button class="btn" id="aGuide">🧭 ' + T('guide') + '</button><a class="btn" href="privacy_policy.html" target="_blank" style="text-align:center;text-decoration:none">🔒 ' + T('a_privacy') + '</a></div>'
    + '<div class="card"><p class="muted" style="font-size:14px;margin:0">' + T('a_disc') + '</p></div>';
  $('#aShare').onclick = () => { const d = { title: 'FamilyNest', text: T('shareTxt', { n: ST.name || '' }), url: location.origin + location.pathname }; if (navigator.share) navigator.share(d).catch(() => {}); else (navigator.clipboard ? navigator.clipboard.writeText(d.url) : Promise.reject()).then(() => toast(T('copied'))).catch(() => toast(esc(d.url))); };
  $('#aGuide').onclick = () => openGuide();
}
function openGuide() {
  const steps = [['🎲🐍🔴', 'g1'], ['🤖👨‍👩‍👧', 'g2'], ['💡↩️', 'g3'], ['🌐🎙', 'g4'], ['🎨🏆', 'g5']];
  let i = 0;
  const o = overlay('<div class="guide" id="gBox"></div>');
  const draw = () => {
    o.querySelector('#gBox').innerHTML = '<div class="gbig">' + steps[i][0] + '</div><h2 style="text-align:center;margin-top:8px">' + T(steps[i][1] + 't') + '</h2><p style="font-size:17px;text-align:center">' + T(steps[i][1] + 'd') + '</p>'
      + '<div class="dots">' + steps.map((s, k) => '<i' + (k === i ? ' class="on"' : '') + '></i>').join('') + '</div>'
      + '<div class="row"><button class="btn" data-gd="skip">' + T('skip') + '</button><button class="btn main" data-gd="next">' + (i < steps.length - 1 ? T('next') : T('letsPlay')) + '</button></div>';
  };
  o.onclick = e => { const b = e.target.closest('[data-gd]'); if (!b) return; if (b.dataset.gd === 'next' && i < steps.length - 1) { i++; draw(); } else { ST.guided = true; saveST(); closeOv(o); } };
  draw();
}

/* ---- init.js ---- */
(function init() {
  applyLook(); applyLang(); renderHome();
  $('#mNet').onclick = () => { show('online'); renderNet(); };
  $('#tRules').onclick = () => openRules(null, false);
  $('#tStats').onclick = () => { renderStats(); show('stats'); };
  $('#tReplays').onclick = () => { renderReplays(); show('replays'); };
  $('#tSettings').onclick = () => { renderSettings(); show('settings'); };
  $('#qAbout').onclick = () => { renderAbout(); show('about'); };
  $('#qTheme').onclick = () => { ST.theme = THEMES[(THEMES.indexOf(ST.theme) + 1) % THEMES.length]; saveST(); applyLook(); toast(T('theme') + ': ' + T('th_' + ST.theme), 1200); };
  $('#qMode').onclick = () => { ST.mode = ST.mode === 'day' ? 'night' : 'day'; saveST(); applyLook(); };
  document.addEventListener('click', e => { if (e.target.closest('[data-home]')) { show('home'); renderHome(); } });
  $('#netBack').onclick = () => { show('home'); renderHome(); };
  bindGame(); bindVoice();
  // browsers block sound until the first tap
  addEventListener('pointerdown', () => { try { if (AC && AC.state === 'suspended') AC.resume(); } catch (e) {} }, { passive: true });
  // an online game saved by an older version that no longer matches → drop it gently (local games are not affected)
  if (NET && NET.G && !GAMES[NET.G.game]) { NET = null; LS.del('net'); }
  // invite link: ?join=CODE
  const q = new URLSearchParams(location.search);
  if (q.get('join')) { if (NET && NET.role === 'guest' && NET.sess && NET.sess.code === q.get('join').toUpperCase()) netResume(); else { NET = null; LS.del('net'); show('online'); renderNet(); } }
  else if (!ST.guided && !q.get('noguide')) openGuide();
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  if ('serviceWorker' in navigator && location.protocol !== 'file:' && !q.get('nosw')) navigator.serviceWorker.register('sw.js').catch(() => {});
  window.__fn = { GAMES, FC, UI, get CUR() { return CUR; }, get NET() { return NET; }, get LINK() { return LINK; } };   // for automated tests
})();
