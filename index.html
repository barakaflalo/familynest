<meta property="og:title" content="FamilyNest · כל המשפחה משחקת!">
<meta property="og:description" content="11 משחקי משפחה באפליקציה אחת — מול המחשב, בטלפון אחד או אונליין עם דיבור.">

<link rel="apple-touch-icon" href="icon-192.png">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Secular+One&family=Rubik:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
/* ---------------- tokens: app theme (data-theme × data-mode) ---------------- */
:root{
  --bg:#070707; --panel:#121212; --panel2:#1a1a1a; --line:#2c2a24; --ink:#f3efe4; --muted:#a39d8c;
  --acc:#d4a940; --acc2:#f0cd6e; --accInk:#140f02; --ok:#46b46e; --bad:#e0584f;
  /* the four player colours — every player also has an animal, so colour never carries meaning alone */
  --p0:#e8453c; --p1:#2f9e4f; --p2:#f4b81c; --p3:#2f74d8; --p0d:#a8221b; --p1d:#1b6a32; --p2d:#a8790a; --p3d:#1a4d99;
  /* game boards (data-board): a separate setting from the app theme */
  --bd:#fff8ec; --bd2:#ffe9c7; --bdLine:#e0c9a3; --bdInk:#3b2a14; --bdFrame:#7a4e22; --bdShade:rgba(60,35,10,.25);
  --r:14px; --disp:'Secular One','Rubik',system-ui,sans-serif; --body:'Rubik',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
[data-theme="silver"]{--acc:#c9ced6;--acc2:#eef1f5;--accInk:#0d0f12;--line:#2a2d33}
[data-theme="emerald"]{--acc:#3fbf7f;--acc2:#7fe0ae;--accInk:#03140b;--line:#1f3329}
[data-theme="ruby"]{--acc:#e0566a;--acc2:#f598a6;--accInk:#1a0408;--line:#3a2328}
[data-theme="ocean"]{--acc:#4aa8e8;--acc2:#97d0f6;--accInk:#03111c;--line:#1f2d3a}
[data-mode="day"]{--bg:#f4f2ec;--panel:#ffffff;--panel2:#f0ede5;--line:#d9d3c4;--ink:#17150f;--muted:#6b6455}
[data-mode="day"][data-theme="gold"]{--acc:#a8801c;--acc2:#c99b2c;--accInk:#fff}
[data-mode="day"][data-theme="silver"]{--acc:#5c6573;--acc2:#7d8796;--accInk:#fff}
[data-mode="day"][data-theme="emerald"]{--acc:#1f8a55;--acc2:#2ea96b;--accInk:#fff}
[data-mode="day"][data-theme="ruby"]{--acc:#b8344a;--acc2:#d14d62;--accInk:#fff}
[data-mode="day"][data-theme="ocean"]{--acc:#1f6fa8;--acc2:#2f8acb;--accInk:#fff}
/* board styles come after the themes with the same specificity → they win, no !important */
[data-board="bright"]{--bd:#fff8ec;--bd2:#ffe9c7;--bdLine:#e0c9a3;--bdInk:#3b2a14;--bdFrame:#7a4e22;--bdShade:rgba(60,35,10,.25)}
[data-board="pastel"]{--bd:#fbf7ff;--bd2:#ece4fb;--bdLine:#d3c6ec;--bdInk:#40335c;--bdFrame:#8b77b8;--bdShade:rgba(60,40,100,.2);--p0:#f07a73;--p1:#5fbf7f;--p2:#f6cb57;--p3:#6f9fe6}
[data-board="wood"]{--bd:#f3dfb9;--bd2:#e6c690;--bdLine:#c49a5e;--bdInk:#3f2810;--bdFrame:#5a3519;--bdShade:rgba(40,20,5,.3)}
[data-board="contrast"]{--bd:#ffffff;--bd2:#e8e8e8;--bdLine:#000;--bdInk:#000;--bdFrame:#000;--bdShade:rgba(0,0,0,.4);--p0:#ff1f1f;--p1:#00a83a;--p2:#ffc400;--p3:#0055ff;--p0d:#000;--p1d:#000;--p2d:#000;--p3d:#000}
[data-board="theme"]{--bd:var(--panel2);--bd2:var(--panel);--bdLine:var(--line);--bdInk:var(--ink);--bdFrame:var(--acc);--bdShade:rgba(0,0,0,.35)}

body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:16px/1.5 var(--body);-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--acc2);outline-offset:2px}
input,select{font:inherit;color:var(--ink);background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
h1,h2,h3{font-family:var(--disp);font-weight:400;margin:0;line-height:1.15}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}
.muted{color:var(--muted)}
.hide{display:none!important}

/* ---------------- screens ---------------- */
.scr{display:none;min-height:100vh;min-height:100dvh;flex-direction:column}
.scr.on{display:flex;animation:scrIn .18s ease-out}
@keyframes scrIn{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
.bar{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--panel)}
.bar h2{font-size:22px;flex:1}
.back{min-width:48px;height:44px;border-radius:12px;border:1.5px solid var(--acc);background:transparent;color:var(--acc);font-size:20px;font-weight:700}
.wrap{padding:16px;max-width:640px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.card h3{font-size:19px;margin-bottom:8px}
.btn{border:1.5px solid var(--acc);background:transparent;color:var(--acc);border-radius:12px;padding:12px 16px;font-weight:700;min-height:48px}
.btn.main{background:var(--acc);color:var(--accInk);font-size:18px}
.btn.wide{width:100%}
.btn:disabled{opacity:.4;cursor:default}
.btn.small{min-height:38px;padding:6px 12px;font-size:14px}
.btn.huge{min-height:62px;font-size:22px;font-family:var(--disp);font-weight:400;border-radius:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row>*{flex:1}
.seg{display:flex;border:1.5px solid var(--line);border-radius:12px;overflow:hidden;flex-wrap:wrap}
.seg>button{flex:1;border:0;background:transparent;padding:10px 6px;min-height:46px;font-weight:500;color:var(--muted)}
.seg>button.on{background:var(--acc);color:var(--accInk);font-weight:700}
label.f{display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--muted)}
.sw{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}
.sw:last-child{border-bottom:0}
.sw input[type=checkbox]{width:26px;height:26px;accent-color:var(--acc);flex:none}
.sw small{display:block;font-size:13px}
.toast{position:fixed;inset-inline:12px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:90;background:var(--panel);border:1px solid var(--acc);color:var(--ink);padding:12px 16px;border-radius:12px;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.5);opacity:0;transform:translateY(20px);transition:.2s;pointer-events:none}
.toast.on{opacity:1;transform:none}
.badge{text-align:center;font-size:12px;color:var(--muted);padding:18px 0 8px}
.badge b{color:var(--acc);font-weight:700}

/* ---------------- home ---------------- */
#home .hero{padding:58px 18px 4px;text-align:center;position:relative;overflow:hidden}
.floaty{display:flex;justify-content:center;gap:14px;font-size:38px;height:58px;margin-top:8px}
.floaty>span{display:inline-block;animation:bob 3s ease-in-out infinite}
.floaty>span:nth-child(2){animation-delay:.4s}.floaty>span:nth-child(3){animation-delay:.8s}.floaty>span:nth-child(4){animation-delay:1.2s}.floaty>span:nth-child(5){animation-delay:1.6s}
@keyframes bob{50%{transform:translateY(-8px) rotate(-6deg)}}
.wordmark{font-family:var(--disp);font-size:56px;line-height:.95;margin-top:6px;color:var(--ink);letter-spacing:.5px;direction:ltr}
.wordmark i{font-style:normal;color:var(--acc)}
.sub{display:inline-block;margin-top:8px;font-family:var(--disp);font-size:21px;color:var(--accInk);background:var(--acc);padding:2px 14px 4px;border-radius:10px;transform:rotate(-2.5deg)}
.quickset{position:absolute;top:10px;inset-inline-end:12px;display:flex;gap:6px;z-index:2}
.quickset button{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--panel);font-size:18px}
.games{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.gtile{position:relative;border:0;border-radius:20px;padding:10px 10px 12px;min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;color:#fff;overflow:hidden;box-shadow:inset 0 -5px 0 rgba(0,0,0,.22),0 4px 14px rgba(0,0,0,.25);text-align:center}
.gtile:active{transform:scale(.97)}
.gtile .art{width:100%;flex:1;display:grid;place-items:center;min-height:86px}
.gtile .art svg{width:86%;max-width:150px;height:auto;max-height:96px;filter:drop-shadow(0 3px 0 rgba(0,0,0,.18))}
.gtile b{font-family:var(--disp);font-weight:400;font-size:19px;line-height:1.1;text-shadow:0 2px 0 rgba(0,0,0,.25)}
.gtile .np{position:absolute;top:8px;inset-inline-start:8px;background:rgba(0,0,0,.28);border-radius:20px;font-size:12px;padding:1px 8px;font-weight:700}
.gt-sl{background:linear-gradient(160deg,#3fb35f,#1f7a3d)}
.gt-ludo{background:linear-gradient(160deg,#f05a4f,#b8322a)}
.gt-c4{background:linear-gradient(160deg,#3d8bf0,#1d55b8)}
.gt-ttt{background:linear-gradient(160deg,#9b5de5,#6a33b8)}
.gt-mem{background:linear-gradient(160deg,#ff9f43,#d8701a)}
.gt-dots{background:linear-gradient(160deg,#16b6a8,#0b7d73)}
.gt-bs{background:linear-gradient(160deg,#3d8bff,#1d4fb8)}
.gt-dom{background:linear-gradient(160deg,#8b5cf6,#5b2fc2)}
.modes{display:grid;gap:12px}
.mode{display:flex;align-items:center;gap:14px;text-align:start;background:var(--panel);border:1.5px solid var(--line);border-radius:16px;padding:14px 16px;min-height:72px}
.mode .ic{font-size:30px;width:52px;height:52px;display:grid;place-items:center;border-radius:14px;background:var(--panel2);flex:none}
.mode b{display:block;font-size:19px;font-family:var(--disp);font-weight:400}
.mode span{font-size:14px;color:var(--muted)}
.mode.prime{border-color:var(--acc)}
.mode.resume{border-style:dashed;border-color:var(--acc)}
.tools{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tools button{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 4px;min-height:64px;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted)}
.tools button i{font-style:normal;font-size:22px}

/* ---------------- setup ---------------- */
.mbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mbtns>button{border:2px solid var(--line);background:var(--panel2);border-radius:16px;min-height:72px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-weight:700}
.mbtns>button i{font-style:normal;font-size:28px}
.mbtns>button.on{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 18%,var(--panel2))}
.seats{display:flex;flex-direction:column;gap:8px}
.seat{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:14px;background:var(--panel2);border-inline-start:6px solid var(--sc,var(--line))}
.seat>.d{width:10px;height:10px;border-radius:50%;background:var(--ok);flex:none}
.seat>.d.no{background:var(--bad)}
.seat>b{flex:1}
.seat input{flex:1;min-width:0}
.avb{width:46px;height:46px;border-radius:50%;border:2px solid var(--line);background:var(--panel);font-size:26px;display:grid;place-items:center;flex:none;padding:0;line-height:1}
.kind{min-width:52px;height:46px;border-radius:12px;border:1.5px solid var(--line);background:var(--panel);font-size:22px;flex:none}
.cnt{display:flex;align-items:center;gap:12px;justify-content:center}
.cnt>button{width:52px;height:52px;border-radius:50%;border:2px solid var(--acc);background:transparent;color:var(--acc);font-size:26px;font-weight:700}
.cnt>b{font-family:var(--disp);font-size:34px;min-width:40px;text-align:center}
.lvls{display:flex;flex-direction:column;gap:8px}
.lvls>button{display:flex;align-items:center;gap:10px;border:2px solid var(--line);background:var(--panel2);border-radius:14px;padding:8px 12px;min-height:52px;text-align:start}
.lvls>button.on{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 16%,var(--panel2))}
.lvls>button .st{font-size:15px;letter-spacing:1px;flex:none;direction:ltr;min-width:84px}
.lvls>button b{font-weight:700}
.vars{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.vars>button{border:2px solid var(--line);background:var(--panel2);border-radius:14px;padding:6px;display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:700;min-height:64px}
.vars>button.on{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 16%,var(--panel2))}
.vars>button svg{width:100%;height:auto;max-height:110px;border-radius:8px}
.vars>button small{font-weight:400;color:var(--muted);font-size:12px}
.avs{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.avs>button{padding:0;border:3px solid transparent;border-radius:50%;background:var(--panel2);aspect-ratio:1;font-size:24px;line-height:1}
.avs>button.on{border-color:var(--acc)}

/* ---------------- game screen ---------------- */
#game{height:100vh;height:100dvh;min-height:0;overflow:hidden}
#game.on{display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr) auto auto;grid-template-areas:"top" "pl" "board" "act" "voice"}
.gtop{grid-area:top;display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--panel);border-bottom:1px solid var(--line)}
.gtop .back{min-width:42px;height:38px}
.gtop .ttl{flex:1;font-size:13px;color:var(--muted);line-height:1.2;min-width:0}
.gtop .ttl b{display:block;font-family:var(--disp);font-weight:400;color:var(--ink);font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:40px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);font-size:17px;flex:none}
.net{font-size:12px;padding:3px 8px;border-radius:20px;border:1px solid var(--line);white-space:nowrap}
.net.ok{border-color:var(--ok);color:var(--ok)} .net.warn{border-color:var(--bad);color:var(--bad)}
.plist{grid-area:pl;display:flex;gap:6px;padding:6px 8px;background:var(--panel);overflow-x:auto}
.pchip{flex:1 1 0;min-width:0;max-width:220px;display:flex;align-items:center;gap:6px;border:2px solid var(--line);border-radius:14px;padding:4px 6px;background:var(--panel2);position:relative;border-bottom:5px solid var(--pc)}
.pchip.turn{border-color:var(--pc);box-shadow:0 0 0 2px color-mix(in srgb,var(--pc) 40%,transparent);animation:glow 1.4s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 0 5px color-mix(in srgb,var(--pc) 25%,transparent)}}
.pchip .em{font-size:24px;line-height:1;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--pc);flex:none;box-shadow:inset 0 -3px 0 rgba(0,0,0,.2)}
.pchip .nm{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;line-height:1.15}
.pchip .nm small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.pchip .off{color:var(--bad);font-size:11px}
.pchip .sc{margin-inline-start:auto;font:400 20px/1 var(--disp);flex:none;padding-inline-start:4px}
.plist.many .pchip{flex-direction:column;gap:1px;padding:3px 2px;text-align:center}
.plist.many .pchip .nm{font-size:11px;max-width:100%}
.plist.many .pchip .sc{margin:0;font-size:16px;padding:0}
.plist.many .pchip .em{width:28px;height:28px;font-size:20px}
.bwrap{grid-area:board;position:relative;display:flex;align-items:center;justify-content:center;min-height:0;overflow:hidden;padding:6px;background:radial-gradient(ellipse at 50% 40%,color-mix(in srgb,var(--acc) 10%,var(--bg)),var(--bg) 75%)}
.bd{position:relative;flex:none;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.bd>svg.base{position:absolute;inset:0;width:100%;height:100%;display:block}
.status{position:absolute;top:6px;inset-inline:6px;display:flex;justify-content:center;pointer-events:none;z-index:6}
.status>span{background:rgba(0,0,0,.62);color:#fff;font-size:15px;padding:3px 14px;border-radius:20px;max-width:100%;text-align:center}
.gact{grid-area:act;display:flex;gap:8px;padding:8px 10px;background:var(--panel);align-items:center;border-top:1px solid var(--line)}
.gact .btn{min-height:56px;padding:6px 10px}
.gact .grow{flex:1}
.dieBtn{flex:1;display:flex;align-items:center;justify-content:center;gap:12px;border-radius:18px;border:0;min-height:64px;background:var(--dc,var(--acc));color:#fff;font:400 23px/1 var(--disp);box-shadow:inset 0 -5px 0 rgba(0,0,0,.25);text-shadow:0 2px 0 rgba(0,0,0,.25)}
.dieBtn:disabled{filter:saturate(.35) brightness(.75);cursor:default}
.dieBtn.go{animation:wiggle 1.2s ease-in-out infinite}
@keyframes wiggle{0%,100%{transform:none}10%{transform:rotate(-3deg) scale(1.03)}20%{transform:rotate(3deg) scale(1.03)}30%{transform:none}}
.dieBtn svg{width:46px;height:46px;flex:none;filter:drop-shadow(0 3px 2px rgba(0,0,0,.35))}
.dieBtn svg.rolling{animation:tumble .5s linear}
@keyframes tumble{0%{transform:rotate(0) scale(1)}50%{transform:rotate(200deg) scale(1.25)}100%{transform:rotate(360deg) scale(1)}}
.voice{grid-area:voice;display:flex;gap:6px;padding:6px 10px calc(6px + env(safe-area-inset-bottom,0px));background:var(--panel2);border-top:1px solid var(--line);align-items:center;position:relative}
.voice .btn{min-height:44px;padding:6px 10px;font-size:14px}
.ptt{flex:1.6;user-select:none;-webkit-user-select:none;touch-action:none}
.ptt.on{background:var(--ok)!important;color:#000!important;border-color:var(--ok)!important}
.vbtn.on{background:var(--acc);color:var(--accInk)}
.rec.on{background:var(--bad);color:#fff;border-color:var(--bad)}
.emo{position:absolute;bottom:100%;inset-inline:8px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;z-index:40;box-shadow:0 -6px 24px rgba(0,0,0,.4)}
.emo>button{border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:6px 10px;font-size:15px;min-height:40px}
.emo>button.e{font-size:22px;padding:4px 8px}
#bubbles{position:fixed;inset:0;pointer-events:none;z-index:55}
.bubble{position:absolute;max-width:min(80vw,320px);background:#fffaf0;color:#111;border-radius:12px;padding:5px 10px;font-size:14px;font-weight:500;box-shadow:0 4px 14px rgba(0,0,0,.4);animation:pop .25s ease-out}
.bubble.big{font-size:32px;padding:0 6px;background:transparent;box-shadow:none}
.bubble.mine{background:var(--acc2);color:var(--accInk)}
.bubble.vm{pointer-events:auto;background:var(--acc);color:var(--accInk)}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
/* big "your turn" banner + win stamp */
.banner{position:absolute;inset:0;display:flex;justify-content:center;align-items:flex-start;padding-top:9%;pointer-events:none;z-index:20}
.banner>div{font-family:var(--disp);font-size:min(9vw,44px);color:#fff;background:var(--pc,var(--acc));padding:6px 26px 10px;border-radius:24px;box-shadow:0 8px 0 rgba(0,0,0,.25),0 12px 30px rgba(0,0,0,.4);animation:bannerIn 1.1s ease-out both;text-align:center;line-height:1.1;max-width:92%}
.banner>div small{display:block;font-size:.45em;opacity:.9}
@keyframes bannerIn{0%{transform:scale(.3) rotate(-8deg);opacity:0}18%{transform:scale(1.12) rotate(2deg);opacity:1}30%{transform:scale(1) rotate(0)}80%{opacity:1}100%{opacity:0;transform:scale(1.05)}}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:70;overflow:hidden}
.confetti>i{position:absolute;top:-20px;width:10px;height:14px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(var(--rot));opacity:.9}}
/* landscape: board on one side, controls on the other */
@media (orientation:landscape) and (max-height:560px){
  #game.on{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto auto;grid-template-areas:"top top" "board pl" "board act" "board voice"}
  .plist{flex-direction:column;overflow-y:auto;border-inline-start:1px solid var(--line)}
  .pchip{max-width:none;flex:0 0 auto}
  .plist.many .pchip{flex-direction:row;text-align:start;padding:3px 6px;gap:6px}
  .plist.many .pchip .sc{margin-inline-start:auto}
  .gact,.voice{border-inline-start:1px solid var(--line)}
}

/* ---------------- tokens (all games) ---------------- */
.tok{position:absolute;width:var(--ts);height:var(--ts);margin-left:calc(var(--ts)/-2);margin-top:calc(var(--ts)/-2);border-radius:50%;background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--pc) 55%,#fff),var(--pc) 55%,var(--pcd) 100%);
  box-shadow:0 0 0 calc(var(--ts)*.07) #fff,0 calc(var(--ts)*.12) calc(var(--ts)*.18) rgba(0,0,0,.45);display:grid;place-items:center;font-size:calc(var(--ts)*.58);line-height:1;z-index:5;pointer-events:none;transition:transform .15s}
.tok.mv{animation:mvPulse 1s ease-in-out infinite;z-index:7}
@keyframes mvPulse{50%{box-shadow:0 0 0 calc(var(--ts)*.07) #fff,0 0 0 calc(var(--ts)*.2) color-mix(in srgb,var(--pc) 70%,transparent),0 4px 8px rgba(0,0,0,.45)}}
.tok.hintt{box-shadow:0 0 0 calc(var(--ts)*.1) #59c3ff,0 0 14px #59c3ff}
.tok.hopping{z-index:9}
.tok.sel{transform:scale(1.18)}

/* ---------------- snakes & ladders ---------------- */
.sl-num{font:700 22px var(--body);fill:var(--bdInk);opacity:.55}
/* ---------------- ludo ---------------- */
/* ---------------- connect four ---------------- */
.bd-c4{background:linear-gradient(#dbe9ff,#bcd5fb);border-radius:14px}
[data-board="contrast"] .bd-c4{background:#fff}
[data-board="theme"] .bd-c4{background:var(--panel2)}
.c4-frame{position:absolute;inset:0}
.c4-disc{position:absolute;border-radius:50%;background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--pc) 50%,#fff),var(--pc) 58%,var(--pcd));box-shadow:inset 0 -4px 0 rgba(0,0,0,.2);z-index:1;display:grid;place-items:center;font-size:calc(var(--cs)*.42)}
.c4-disc.win{animation:winPulse .7s ease-in-out infinite;z-index:3}
@keyframes winPulse{50%{transform:scale(.86);filter:brightness(1.3)}}
.c4-hover{position:absolute;border-radius:50%;opacity:.55;z-index:4;pointer-events:none}
.c4-hint{position:absolute;border:4px dashed #59c3ff;border-radius:14px;z-index:4;pointer-events:none;animation:pop .3s}
/* ---------------- tic-tac-toe ---------------- */
.tt-mark{position:absolute;pointer-events:none;z-index:2}
.tt-mark path,.tt-mark circle{fill:none;stroke-linecap:round}
.tt-mark.draw path,.tt-mark.draw circle{stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:ink .28s ease-out forwards}
.tt-mark.draw path+path{animation-delay:.14s}
@keyframes ink{to{stroke-dashoffset:0}}
.tt-ghost{position:absolute;z-index:3;pointer-events:none;border-radius:12%;animation:pop .2s}
/* ---------------- memory ---------------- */
.mm-card{position:absolute;perspective:600px}
.mm-in{position:absolute;inset:0;transition:transform .35s;transform-style:preserve-3d}
.mm-card.up .mm-in{transform:rotateY(180deg)}
.mm-f,.mm-b{position:absolute;inset:0;border-radius:14%;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:grid;place-items:center;box-shadow:0 3px 0 rgba(0,0,0,.2),0 4px 10px rgba(0,0,0,.25)}
.mm-b{background:repeating-linear-gradient(45deg,var(--acc) 0 8px,color-mix(in srgb,var(--acc) 70%,#000) 8px 16px);border:3px solid #fff}
.mm-b::after{content:'?';font:400 calc(var(--cw)*.5)/1 var(--disp);color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.3)}
.mm-f{transform:rotateY(180deg);background:#fff;font-size:calc(var(--cw)*.6);line-height:1;border:4px solid var(--oc,#fff)}
.mm-card.got .mm-f{animation:gotIt .6s ease-out}
@keyframes gotIt{40%{transform:rotateY(180deg) scale(1.15)}}
.mm-card.miss .mm-f{animation:missIt .4s}
@keyframes missIt{25%{transform:rotateY(180deg) translateX(-5px)}75%{transform:rotateY(180deg) translateX(5px)}}
/* ---------------- dots & boxes ---------------- */
.dt-tap{cursor:pointer}

/* ---------------- overlays ---------------- */
.ov{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;padding:14px}
.ov>.box{background:var(--panel);border:1px solid var(--acc);border-radius:18px;max-width:560px;width:100%;max-height:calc(100dvh - 28px);overflow:auto;padding:18px}
.ov h2{font-size:26px;margin-bottom:6px}
.res{display:flex;flex-direction:column;gap:8px;margin:12px 0}
.rp{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;padding:8px 10px;background:var(--panel2);border-inline-start:6px solid var(--pc)}
.rp.win{border-color:var(--ok);border-inline-start-color:var(--pc)}
.rp .em{font-size:26px}
.rp b{flex:1}
.rp .pl{font:400 22px var(--disp)}
.trophy{font-size:72px;text-align:center;line-height:1;animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
table.sc{width:100%;border-collapse:collapse;font-size:14px}
table.sc th,table.sc td{border-bottom:1px solid var(--line);padding:6px 4px;text-align:center}
table.sc th{color:var(--muted);font-weight:500}
.code{font-family:var(--disp);font-size:52px;letter-spacing:6px;color:var(--acc);text-align:center;direction:ltr}
.gpick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.gpick>button{border:2px solid var(--line);background:var(--panel2);border-radius:14px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13px;font-weight:700;min-height:74px}
.gpick>button i{font-style:normal;font-size:28px}
.gpick>button.on{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 16%,var(--panel2))}
.guide .dots{display:flex;gap:6px;justify-content:center;margin:12px 0}
.guide .dots>i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.guide .dots>i.on{background:var(--acc)}
.guide .gbig{font-size:64px;text-align:center;line-height:1.1}
.rules p,.rules li{line-height:1.65}
.rules h3{color:var(--acc);margin-top:6px}
.rules .rg{border:1px solid var(--line);border-radius:14px;padding:4px 14px 10px;margin-bottom:12px;background:var(--panel)}
.rules .rg>h2{font-size:22px;margin:8px 0 2px}
.rv .rbd{display:flex;justify-content:center;margin:8px 0}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stat>div{background:var(--panel2);border-radius:12px;padding:8px 4px}
.stat b{display:block;font-family:var(--disp);font-size:24px;font-weight:400;color:var(--acc)}
.stat span{font-size:12px;color:var(--muted)}
.persona{text-align:center}
.persona .big{font-size:80px;line-height:1.1}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.fast *{animation-duration:0s!important;transition-duration:0s!important}
/* ---------------- 1.1: board moments, talking characters, stickers ---------------- */
.sl-lnk{transition:filter .25s}
.sl-lnk.lit{filter:drop-shadow(0 0 8px #fff6a0) drop-shadow(0 0 20px #ffd23f);animation:litPulse .45s ease-in-out infinite alternate}
@keyframes litPulse{to{filter:drop-shadow(0 0 14px #fff6a0) drop-shadow(0 0 32px #ffb627)}}
.tok.swallow{transform:scale(.45) rotate(25deg);opacity:.7;filter:saturate(.5) brightness(.85);transition:transform .2s,opacity .2s}
.tok.popout{animation:popout .5s cubic-bezier(.2,1.7,.4,1)}
@keyframes popout{0%{transform:scale(.3)}100%{transform:none}}
.tok.cur{animation:bob2 1.3s ease-in-out infinite}
.tok.cur.mv{animation:bob2 1.3s ease-in-out infinite,mvPulse 1s ease-in-out infinite}
@keyframes bob2{50%{transform:translateY(-16%)}}
.bubble.talk{background:#fff;color:#222;border:2px solid var(--acc);font-size:15px;font-weight:700;border-radius:16px 16px 16px 4px}
.stk{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:8px;margin-top:6px}
.stk-i{display:flex;flex-direction:column;align-items:center;gap:2px;border:1.5px dashed var(--line);border-radius:14px;padding:8px 4px;background:var(--panel2);font-size:11px;color:var(--muted);line-height:1.2;text-align:center}
.stk-i i{font-style:normal;font-size:30px;filter:grayscale(1) opacity(.35)}
.stk-i.got{border-style:solid;border-color:var(--acc);color:var(--ink)}
.stk-i.got i{filter:none;animation:pop .4s}
.stk-new{border:2px solid var(--acc);border-radius:14px;padding:8px 10px;margin:8px 0;background:color-mix(in srgb,var(--acc) 12%,var(--panel2))}

/* ---------------- 1.2 drawn art (falls back to emoji when a file is missing) ---------------- */
img.ai{width:1.2em;height:1.2em;object-fit:contain;vertical-align:-.28em;pointer-events:none;-webkit-user-drag:none;user-select:none}
.aif{display:inline}
.tok img.ai{width:100%;height:100%}
.pchip .em img.ai{width:122%;height:122%;filter:drop-shadow(0 1px 1px rgba(0,0,0,.3))}
.plist.many .pchip .em img.ai{width:120%;height:120%}
.c4-disc img.ai{width:80%;height:80%}
.mm-f img.mi{width:84%;height:84%}
.avb img.ai,.avs>button img.ai{width:108%;height:108%}
.seat .avb{overflow:visible}
.persona .big img.ai{width:132px;height:132px;vertical-align:middle}
.trophy img.ai{width:120px;height:120px;vertical-align:middle}
.rp .em img.ai{width:40px;height:40px}
.banner img.ai{width:1.3em;height:1.3em}
.seg img.ai{width:1.6em;height:1.6em;vertical-align:-.45em}
.dieBtn span img.ai{width:1.5em;height:1.5em}
.gtile .art img.tl{width:94%;max-width:180px;height:auto;max-height:112px;object-fit:contain;filter:drop-shadow(0 4px 2px rgba(0,0,0,.25))}
html.art .mm-b{background:url(card-back.webp) center/cover,repeating-linear-gradient(45deg,var(--acc) 0 8px,color-mix(in srgb,var(--acc) 70%,#000) 8px 16px)}
html.art .mm-b::after{content:none}
/* Ludo: real pawns with the animal's face on the head */
.tok.pw{background:none;box-shadow:none;width:calc(var(--ts)*1.6);height:calc(var(--ts)*1.6);margin-left:calc(var(--ts)*-.8);margin-top:calc(var(--ts)*-1.12);filter:drop-shadow(0 2px 2px rgba(0,0,0,.45))}
.tok.pw img.pawn{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.tok.pw .pf{position:absolute;left:50%;top:28%;width:60%;height:60%;transform:translate(-50%,-50%);display:grid;place-items:center;font-size:calc(var(--ts)*.5);line-height:1}
.tok.pw .pf img.ai{width:100%;height:100%}
.tok.pw.mv{animation:pwPulse 1s ease-in-out infinite}
.tok.pw.cur.mv{animation:bob2 1.3s ease-in-out infinite,pwPulse 1s ease-in-out infinite}
.tok.pw.hintt{box-shadow:none;filter:drop-shadow(0 0 5px #59c3ff) drop-shadow(0 0 3px #59c3ff)}
@keyframes pwPulse{50%{filter:drop-shadow(0 0 calc(var(--ts)*.16) #fff) drop-shadow(0 0 calc(var(--ts)*.12) var(--pc))}}
/* space board: black holes turn slowly */
.sl-spin{animation:slSpin 9s linear infinite}
@keyframes slSpin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.sl-spin{animation:none}}

/* ---------------- 1.3 Battleship ---------------- */
.bd-bs .bs-g{position:absolute;transition:left .35s ease,top .35s ease,width .35s ease,height .35s ease;border-radius:12px;box-shadow:0 4px 14px rgba(0,0,0,.3);touch-action:none}
.bd-bs .bs-g svg{width:100%;height:100%;display:block}
.bd-bs .bs-g:not(.big){opacity:.92}
.bd-bs .bs-g.aim.big{box-shadow:0 0 0 3px #ffeb3b,0 4px 14px rgba(0,0,0,.3)}
.bd-bs .bs-tag{position:absolute;top:4px;inset-inline-start:6px;font-size:18px;filter:drop-shadow(0 1px 1px rgba(0,0,0,.5));pointer-events:none}
.bd-bs .bs-g:not(.big) .bs-tag{font-size:14px}
.bd-bs .bs-p{position:absolute;display:flex;flex-direction:column;justify-content:center;gap:10px;padding:6px 4px}
.bs-row{display:flex;align-items:center;gap:8px}
.bs-row .em{font-size:22px;line-height:1;flex:none}
.bs-row .em img.ai{width:32px;height:32px}
.bs-fl{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.bs-mini{display:inline-block;height:12px;border-radius:6px;background:var(--sc);box-shadow:inset 0 -2px 0 rgba(0,0,0,.25)}
.bs-mini.gone{background:#59606b;opacity:.55;position:relative}
.bs-mini.gone::after{content:'';position:absolute;left:-2px;right:-2px;top:5px;height:2px;background:#e53935;transform:rotate(-8deg)}
.bs-ship.sel rect:first-child,.bs-ship.ok rect:first-child{stroke:#ffeb3b;stroke-width:.12}
.bs-ship.bad rect:first-child{stroke:#ff1744;stroke-width:.14;opacity:.75}
.bs-ship.ok,.bs-ship.bad{filter:drop-shadow(0 .1px .15px rgba(0,0,0,.6))}
.bs-pop{animation:bsPop .35s cubic-bezier(.2,1.7,.4,1)}
@keyframes bsPop{0%{transform:scale(0)}100%{transform:scale(1)}}
.bs-bomb{position:absolute;margin-left:-0px;margin-top:-0px;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle at 35% 30%,#666,#111);box-shadow:0 0 0 3px rgba(255,255,255,.6);z-index:9;pointer-events:none;animation:bsDrop .42s ease-in forwards}
@keyframes bsDrop{0%{transform:translate(-50%,-50%) scale(3.2);opacity:.15}100%{transform:translate(-50%,-50%) scale(.55);opacity:1}}
.bs-g.shake{animation:bsShake .4s}
@keyframes bsShake{20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}

/* ---------------- 1.3 Dominoes ---------------- */
.bd-dom .dm-t.hd.dim{opacity:.42}
.bd-dom .dm-t.ch{transform-box:fill-box;transform-origin:center}
.bd-dom .dm-end circle{animation:dmGlow 1s ease-in-out infinite}
@keyframes dmGlow{50%{opacity:.45}}
.dm-chip{display:inline-block;width:8px;height:14px;border-radius:2px;background:#fffdf6;border:1px solid rgba(0,0,0,.5);vertical-align:-2px;margin-inline-end:2px;box-shadow:inset 0 6px 0 -5px rgba(0,0,0,.5)}

/* ---------------- 1.3 pass-the-phone curtain ---------------- */
.ov.curtain{background:var(--bg);backdrop-filter:none}
.ov.curtain .box{background:transparent;box-shadow:none;border:0;text-align:center}
.curtain-in .big{font-size:96px;line-height:1.1;margin-top:20px}
.curtain-in .big img.ai{width:150px;height:150px}
.curtain-in h2{font-size:28px;color:var(--pc)}

/* ---------------- 1.4 challenge games ---------------- */
.ch-ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:6%;z-index:12;background:rgba(0,0,0,.28);border-radius:14px}
.ch-card{background:var(--panel);border:2px solid var(--pc,var(--acc));border-radius:20px;padding:14px 16px;max-width:340px;width:100%;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.45)}
.ch-card.dim{border-color:var(--line)}
.ch-who{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:44px;line-height:1}
.ch-who img.ai{width:72px;height:72px}
.ch-who b{font-size:20px;color:var(--pc,var(--ink))}
.ch-st{font-family:var(--disp);font-size:20px;margin:4px 0}
.ch-beat{font-weight:700;color:var(--acc);margin:2px 0 4px}
.ch-how{font-size:14px;color:var(--muted);margin:6px 0 10px;line-height:1.35}
.ch-done{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:10px}
.ch-r{background:var(--panel2);border-radius:12px;padding:3px 8px;font-size:13px;display:inline-flex;align-items:center;gap:4px}
.ch-r i{font-style:normal}.ch-r img.ai{width:22px;height:22px}
.ch-bar{flex:1;display:flex;align-items:center;justify-content:space-around;gap:10px;border-radius:18px;min-height:64px;background:var(--panel2);border:1px solid var(--line);font-size:20px}
.ch-bar b{font:400 26px var(--disp);color:var(--acc)}
.bd canvas.ch-cv{border-radius:14px;touch-action:none}
.mt-svg{touch-action:none}
.mt-svg .mt{transition:transform .22s cubic-bezier(.2,.9,.3,1.2);cursor:grab;filter:drop-shadow(0 .03px .05px rgba(0,0,0,.6))}
.mt-svg .mt.drag{transition:none;cursor:grabbing}
.mt-svg.won .mt{animation:mtWin .7s ease-in-out 2}
@keyframes mtWin{50%{filter:drop-shadow(0 0 .12px #ffeb3b) brightness(1.15)}}
.stg{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:4px}
.stg button{border:1.5px solid var(--line);background:var(--panel2);color:var(--ink);border-radius:12px;padding:5px 0 3px;display:flex;flex-direction:column;align-items:center;line-height:1.1}
.stg button b{font:400 17px var(--disp)}.stg button small{font-size:9px;min-height:11px}
.stg button.on{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 22%,var(--panel2))}
.stg button:disabled{opacity:.4}
.gt-match{background:linear-gradient(160deg,#ff6b9a,#c2185b)}
.gt-buzz{background:linear-gradient(160deg,#5c6b7a,#2b3440)}
.gt-maze{background:linear-gradient(160deg,#c98a4b,#8a5320)}

.mode.daily{border-color:var(--acc)}
.mode.daily.done{opacity:.8}
.bd>canvas.base{position:absolute;inset:0;width:100%;height:100%;display:block}

</style>
</head>
<body>
<!-- HOME -->
<section class="scr on" id="home">
  <div class="hero">
    <div class="quickset">
      <button id="qTheme" aria-label="theme">🎨</button>
      <button id="qMode" aria-label="day/night">🌓</button>
      <button id="qAbout" aria-label="about">ℹ️</button>
    </div>
    <div class="floaty" aria-hidden="true"><span>🎲</span><span>🐍</span><span>🔴</span><span>⭕</span><span>🃏</span></div>
    <div class="wordmark">Family<i>Nest</i></div>
    <div class="sub" data-t="subtitle"></div>
  </div>
  <div class="wrap">
    <div class="modes" id="resumeBox"></div>
    <div class="games" id="gameGrid"></div>
    <div class="modes"><button class="mode daily" id="mDaily"></button></div>
    <div class="modes">
      <button class="mode prime" id="mNet"><span class="ic">🌐</span><span><b data-t="mNet"></b><span data-t="mNetD"></span></span></button>
    </div>
    <div class="tools">
      <button id="tRules"><i>📖</i><span data-t="rules"></span></button>
      <button id="tStats"><i>📊</i><span data-t="stats"></span></button>
      <button id="tReplays"><i>🎬</i><span data-t="replays"></span></button>
      <button id="tSettings"><i>⚙️</i><span data-t="settings"></span></button>
    </div>
    <div class="badge">AppNest · <b>FamilyNest</b> · <span class="ltr" id="verLbl"></span></div>
  </div>
</section>

<!-- SETUP (vs computer / one phone) -->
<section class="scr" id="setup">
  <div class="bar"><button class="back" data-home></button><h2 id="setupTitle"></h2></div>
  <div class="wrap" id="setupBody"></div>
</section>

<!-- ONLINE -->
<section class="scr" id="online">
  <div class="bar"><button class="back" id="netBack"></button><h2 data-t="mNet"></h2><span class="net" id="netPill"></span></div>
  <div class="wrap" id="netBody"></div>
</section>

<!-- GAME -->
<section class="scr" id="game">
  <div class="gtop">
    <button class="back" id="gBack"></button>
    <div class="ttl"><b id="gTitle"></b><span id="gSub"></span></div>
    <span class="net hide" id="gNet"></span>
    <button class="ib" id="gMenu" aria-label="menu">⋯</button>
  </div>
  <div class="plist" id="plist"></div>
  <div class="bwrap" id="bwrap">
    <div class="bd" id="board"></div>
    <div class="status" id="status"><span></span></div>
    <div class="banner hide" id="banner"><div></div></div>
  </div>
  <div class="gact" id="gact"></div>
  <div class="voice hide" id="voice">

<script>
/* ---- nestlink.js ---- */
/* =====================================================================
   NestLink 1.1 — AppNest online multiplayer module (WebRTC via PeerJS)
   One file, drop into any AppNest game. No server of our own:
   - a public PeerJS server only introduces the phones; game data, voice
     and voice messages then travel directly phone-to-phone.
   - star layout: the host is seat 0 and relays messages between guests,
     so 2–6 players work; voice is a direct mesh (good up to ~4–5).
   - every game message is sequenced and re-sent after a reconnect.
   The game owns the session object (persist it with the game state) and
   receives events through callbacks. See NESTLINK.md for the API.
   1.1: sendTo(seat, d) — a private message to one seat only (card games:
        the host deals each player only their own cards). Compatible with 1.0.
        Heartbeat: a phone that vanished (app closed, no signal) is marked offline
        within ~10 s instead of looking connected forever.
        After a reconnect, if the other side already got more messages than we
        remember sending (we restored an older saved session), numbering continues
        after theirs instead of being silently ignored.
   ===================================================================== */
const NestLink = (() => {
  const CDNS = ['https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js', 'https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js', 'https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.5/peerjs.min.js'];
  const ICE = [{ urls: 'stun:stun.l.google.com:19302' }, { urls: 'stun:stun1.l.google.com:19302' }, { urls: 'stun:stun.cloudflare.com:3478' }];
  const AB = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
  const genCode = (n = 5) => Array.from({ length: n }, () => AB[Math.floor(Math.random() * AB.length)]).join('');
  const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
  function loadScript(u) { return new Promise((res, rej) => { const s = document.createElement('script'); s.src = u; s.onload = res; s.onerror = rej; document.head.appendChild(s); setTimeout(rej, 12000); }); }
  async function loadPeer() { if (window.Peer) return true; for (const u of CDNS) { try { await loadScript(u); if (window.Peer) return true; } catch (e) {} } return false; }
  const b64 = buf => { let s = '', a = new Uint8Array(buf); for (let i = 0; i < a.length; i += 0x8000) s += String.fromCharCode.apply(null, a.subarray(i, i + 0x8000)); return btoa(s); };
  const unb64 = s => { const b = atob(s), a = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) a[i] = b.charCodeAt(i); return a; };

  function create(opt) {
    const L = { status: 'off', lastErr: null, peer: null, conns: {}, retry: null, chunks: {}, calls: {}, audio: {}, mic: null, talking: false, openMic: false, rec: null, seen: {}, hb: {}, hbT: null };
    let S = null;                                         // the session — owned and persisted by the game
    const ev = (k, ...a) => { try { opt[k] && opt[k](...a); } catch (e) { console.error(e); } };
    const persist = () => ev('persist', S);
    const roomId = c => (opt.app || 'nest') + '-v1-' + c.toLowerCase();
    const max = () => opt.maxPlayers || 2;
    const isHost = () => S && S.role === 'host';
    function peerOpts() {
      const q = new URLSearchParams(location.search), o = { debug: 0, config: { iceServers: opt.iceServers || ICE } };
      if (q.get('peerhost')) { o.host = q.get('peerhost'); o.port = +(q.get('peerport') || 9000); o.path = '/'; o.secure = false; }   // test servers only
      return o;
    }
    function setStatus(st, err) { L.status = st; if (err !== undefined) L.lastErr = err; ev('onStatus', st, L.lastErr); }
    const link = seat => S.links[seat] || (S.links[seat] = { seq: 0, lastIn: 0, out: [] });
    const rosterEntry = seat => S.roster.find(p => p.seat === seat);
    function rawTo(seat, m) { const c = L.conns[seat]; try { if (c && c.open) c.send(m); } catch (e) {} }
    function rawAll(m, except) { for (const s in L.conns) if (+s !== except) rawTo(+s, m); }

    /* ---------- starting ---------- */
    async function start(session) {
      close(true); S = session; persist();
      L.hbT = setInterval(beat, 3000);                   // after close(), which clears it
      setStatus('connecting');
      if (!(await loadPeer())) { setStatus('error', 'load'); return false; }
      const peer = L.peer = new Peer(isHost() ? roomId(S.code) : undefined, peerOpts());
      peer.on('open', id => {
        S.pid = id; if (isHost()) { const me = rosterEntry(0); if (me) { me.pid = id; me.online = true; } }
        persist(); setStatus(isHost() ? 'waiting' : 'connecting'); if (!isHost()) connectHost();
      });
      peer.on('connection', c => { if (isHost()) attach(c, null); });
      peer.on('call', onCall);
      peer.on('disconnected', () => setTimeout(() => { try { if (L.peer === peer && !peer.destroyed) peer.reconnect(); } catch (e) {} }, 1500));
      peer.on('error', e => {
        const t = e && e.type;
        if (t === 'unavailable-id') {                     // room id still held (e.g. after reload) — new code while nobody joined, else retry
          if (S.roster.length < 2) { S.code = genCode(); persist(); ev('onCode', S.code); }
          setTimeout(() => start(S), S.roster.length < 2 ? 300 : 4000); return;
        }
        if (t === 'peer-unavailable') { setStatus('notfound', 'nf'); scheduleRetry(); return; }
        if (/network|server-error|socket/.test(t || '')) setStatus('error', 'net');
      });
      return true;
    }
    function host(code) {
      return start({ role: 'host', code: code || genCode(), seat: 0, cid: uid(), roster: [{ seat: 0, name: opt.name ? opt.name() : '', online: true, cid: null, voice: false }], links: {} });
    }
    function join(code) { return start({ role: 'guest', code: code.toUpperCase(), seat: null, cid: uid(), roster: [], links: {} }); }
    function resume(session) { return start(session); }
    function scheduleRetry() { clearTimeout(L.retry); if (S && !isHost() && !(L.conns[0] && L.conns[0].open)) L.retry = setTimeout(connectHost, 3000); }
    function connectHost() { if (!L.peer || L.peer.destroyed || (L.conns[0] && L.conns[0].open)) return; attach(L.peer.connect(roomId(S.code), { reliable: true, serialization: 'json' }), 0); scheduleRetry(); }

    /* ---------- connections ---------- */
    function attach(c, seat) {
      let mySeat = seat;                                  // the seat at the other end of this connection
      const onOpen = () => {
        if (!isHost()) { L.conns[0] = c; rawTo(0, { t: 'hi', cid: S.cid, name: opt.name ? opt.name() : '', have: link(0).lastIn, v: opt.version, hb: 1 }); }
      };
      if (c.open) onOpen(); else c.on('open', onOpen);
      c.on('data', m => {
        if (!m || !m.t) return;
        const key = isHost() ? mySeat : 0;                // 1.1 heartbeat: remember when we last heard from them
        if (key != null) L.seen[key] = Date.now();
        if (m.t === 'ping') { if (key != null) L.hb[key] = 1; return; }
        if (isHost() && m.t === 'hi') {                   // a guest introduces itself → give it a seat (same seat when it comes back)
          let p = S.roster.find(x => x.cid === m.cid);
          if (!p) {
            if (S.roster.length >= max()) { try { c.send({ t: 'full' }); c.close(); } catch (e) {} return; }
            let s = 1; while (S.roster.some(x => x.seat === s)) s++;
            p = { seat: s, cid: m.cid, name: '', online: true, voice: false }; S.roster.push(p); S.roster.sort((a, b) => a.seat - b.seat);
            ev('onJoin', s);
          }
          mySeat = p.seat; p.name = (m.name || '').slice(0, 20); p.online = true; p.pid = c.peer;
          if ((m.have || 0) > link(mySeat).seq) link(mySeat).seq = m.have;   // 1.1: we restored an older session — keep numbering after what they already got
          if (L.conns[mySeat] && L.conns[mySeat] !== c) { try { L.conns[mySeat].close(); } catch (e) {} }
          L.conns[mySeat] = c; L.seen[mySeat] = Date.now(); L.hb[mySeat] = m.hb ? 1 : 0;   // 1.1 phones announce the heartbeat
          rawTo(mySeat, { t: 'hi', seat: mySeat, have: link(mySeat).lastIn, roster: S.roster, v: opt.version, hb: 1 });
          link(mySeat).out.filter(x => x.seq > (m.have || 0)).forEach(x => rawTo(mySeat, x));
          if (m.v && opt.version && m.v.split('.')[0] !== opt.version.split('.')[0]) ev('onVersion', m.v);
          persist(); broadcastRoster(); setStatus('open'); callEveryone();
          return;
        }
        if (!isHost() && m.t === 'hi') {
          S.seat = m.seat; S.roster = m.roster || []; L.seen[0] = Date.now(); L.hb[0] = m.hb ? 1 : 0;
          if ((m.have || 0) > link(0).seq) link(0).seq = m.have;            // 1.1: same protection on the guest side
          persist();
          link(0).out.filter(x => x.seq > (m.have || 0)).forEach(x => rawTo(0, x));
          if (m.v && opt.version && m.v.split('.')[0] !== opt.version.split('.')[0]) ev('onVersion', m.v);
          clearTimeout(L.retry); setStatus('open'); ev('onRoster', S.roster); callEveryone(); return;
        }
        if (m.t === 'full') { setStatus('full', 'full'); close(true); return; }
        onData(m, isHost() ? mySeat : 0);
      });
      const gone = () => {
        if (isHost()) { if (mySeat == null || L.conns[mySeat] !== c) return; delete L.conns[mySeat]; const p = rosterEntry(mySeat); if (p) p.online = false; persist(); broadcastRoster(); setStatus(Object.keys(L.conns).length ? 'open' : 'waiting'); }
        else { if (L.conns[0] !== c) return; delete L.conns[0]; setStatus('reconnecting'); scheduleRetry(); }
        stopAudioFrom(mySeat);
      };
      c.on('close', gone); c.on('error', gone);
    }
    function broadcastRoster() { if (!isHost()) return; rawAll({ t: 'roster', roster: S.roster }); ev('onRoster', S.roster); }

    /* ---------- messages ---------- */
    function onData(m, via) {
      if (m.t === 'roster') { S.roster = m.roster; persist(); ev('onRoster', S.roster); callEveryone(); return; }
      if (m.t === 'need') { link(via).out.filter(x => x.seq > m.have).forEach(x => rawTo(via, x)); return; }
      if (m.t === 'emo' || m.t === 'talk' || m.t === 'vm') {
        if (isHost()) rawAll(m, via);                     // relay to the other guests
        if (m.t === 'emo') ev('onEmoji', m.e, m.from);
        else if (m.t === 'talk') { const p = rosterEntry(m.from); if (p) p.talking = m.on; ev('onTalk', m.from, m.on); }
        else gotChunk(m);
        return;
      }
      if (m.t === 'voice') { const p = rosterEntry(m.from); if (p) p.voice = m.on; if (isHost()) { rawAll(m, via); broadcastRoster(); } callEveryone(); return; }
      if (m.t !== 'm') return;
      const lk = link(via);
      if (m.seq <= lk.lastIn) return;
      if (m.seq > lk.lastIn + 1) { rawTo(via, { t: 'need', have: lk.lastIn }); return; }
      lk.lastIn = m.seq; persist();
      if (isHost() && max() > 2 && !m.p) for (const p of S.roster) if (p.seat !== 0 && p.seat !== m.from) seqTo(p.seat, m.d, m.from);
      ev('onMessage', m.d, m.from);
    }
    function seqTo(seat, d, from, priv) {
      const lk = link(seat), m = { t: 'm', seq: ++lk.seq, from, d }; if (priv) m.p = 1;
      lk.out.push(m); if (lk.out.length > 300) lk.out.splice(0, lk.out.length - 300);
      rawTo(seat, m);
    }
    function send(d) {                                    // reliable, ordered, reaches every other player
      if (!S) return;
      if (isHost()) { for (const p of S.roster) if (p.seat !== 0) seqTo(p.seat, d, 0); }
      else seqTo(0, d, S.seat);
      persist();
    }
    function sendTo(seat, d) {                            // private: host → one guest, or guest → host only (not relayed)
      if (!S || seat === S.seat) return;
      if (isHost()) { if (S.roster.some(p => p.seat === seat)) seqTo(seat, d, 0, true); }
      else seqTo(0, d, S.seat, true);
      persist();
    }
    function emoji(e) { if (S) rawAll({ t: 'emo', e, from: S.seat }); }
    const isOpen = () => !!S && (isHost() ? Object.values(L.conns).some(c => c.open) : !!(L.conns[0] && L.conns[0].open));

    /* ---------- voice: push-to-talk / open mic (direct mesh) ---------- */
    async function micOn() {
      if (L.mic) return true;
      try { L.mic = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } }); }
      catch (e) { ev('onMicError', e && e.name); return false; }
      L.mic.getAudioTracks().forEach(t => t.enabled = L.openMic);
      const me = rosterEntry(S.seat); if (me) me.voice = true;
      const m = { t: 'voice', on: true, from: S.seat }; rawAll(m);
      callEveryone(); return true;
    }
    function callEveryone() {                             // each phone with a mic sends its own one-way audio call to every other phone
      if (!L.mic || !L.peer || !S) return;
      for (const p of S.roster) {
        if (p.seat === S.seat || !p.online || !p.pid) continue;
        const c = L.calls[p.seat]; if (c && !c._dead) continue;
        try { const call = L.peer.call(p.pid, L.mic, { metadata: { seat: S.seat } }); L.calls[p.seat] = call; call.on('close', () => { call._dead = true; }); call.on('error', () => { call._dead = true; }); } catch (e) {}
      }
    }
    function onCall(call) {
      call.answer();                                      // receive only — our own audio goes out on our own call
      call.on('stream', st => {
        const seat = call.metadata && call.metadata.seat;
        let a = L.audio[seat]; if (!a) { a = L.audio[seat] = document.createElement('audio'); a.autoplay = true; a.setAttribute('playsinline', ''); a.style.display = 'none'; document.body.appendChild(a); }
        a.srcObject = st; const p = a.play(); if (p && p.catch) p.catch(() => ev('onAudioBlocked'));
      });
    }
    function stopAudioFrom(seat) { const a = L.audio[seat]; if (a) { a.srcObject = null; a.remove(); delete L.audio[seat]; } const c = L.calls[seat]; if (c) { try { c.close(); } catch (e) {} delete L.calls[seat]; } }
    async function talk(on) {
      if (on && !(await micOn())) return false;
      if (!L.mic) return false;
      L.talking = on || L.openMic; L.mic.getAudioTracks().forEach(t => t.enabled = L.talking);
      rawAll({ t: 'talk', on: L.talking, from: S.seat }); return true;
    }
    async function setOpenMic(on) { L.openMic = on; if (on && !(await micOn())) { L.openMic = false; return false; } return talk(on); }

    /* ---------- voice messages ---------- */
    async function recStart(maxSec) {
      if (L.rec || !(await micOn())) return false;
      const track = L.mic.getAudioTracks()[0].clone(); track.enabled = true;
      const st = new MediaStream([track]), mime = ['audio/webm;codecs=opus', 'audio/ogg;codecs=opus', 'audio/webm', 'audio/mp4'].find(t => window.MediaRecorder && MediaRecorder.isTypeSupported(t)) || '';
      let r; try { r = new MediaRecorder(st, mime ? { mimeType: mime, audioBitsPerSecond: 24000 } : undefined); } catch (e) { ev('onMicError', 'rec'); return false; }
      const parts = [], t0 = Date.now();
      L.rec = { r, track, t0, timer: setTimeout(() => recStop(), (maxSec || 20) * 1000) };
      r.ondataavailable = e => { if (e.data && e.data.size) parts.push(e.data); };
      r.onstop = async () => {
        track.stop();
        const dur = Math.round((Date.now() - t0) / 100) / 10, blob = new Blob(parts, { type: r.mimeType || mime || 'audio/webm' });
        if (L.rec && L.rec.cancel || dur < .4 || !blob.size) { L.rec = null; ev('onRecState', false); return; }
        L.rec = null; ev('onRecState', false);
        const data = b64(await blob.arrayBuffer()), id = uid(), CH = 12000, n = Math.ceil(data.length / CH);
        for (let i = 0; i < n; i++) rawAll({ t: 'vm', id, i, n, dur, mime: blob.type, from: S.seat, data: data.slice(i * CH, (i + 1) * CH) });
        ev('onVoiceMsg', URL.createObjectURL(blob), dur, S.seat, true);
      };
      r.start(); ev('onRecState', true, t0); return true;
    }
    function recStop(cancel) { if (!L.rec) return; clearTimeout(L.rec.timer); L.rec.cancel = !!cancel; try { L.rec.r.stop(); } catch (e) {} }
    function gotChunk(m) {
      const c = L.chunks[m.id] || (L.chunks[m.id] = { parts: [], got: 0, t: Date.now() });
      if (c.parts[m.i] == null) { c.parts[m.i] = m.data; c.got++; }
      if (c.got === m.n) { delete L.chunks[m.id]; const blob = new Blob([unb64(c.parts.join(''))], { type: m.mime || 'audio/webm' }); ev('onVoiceMsg', URL.createObjectURL(blob), m.dur, m.from, false); }
      for (const k in L.chunks) if (Date.now() - L.chunks[k].t > 60000) delete L.chunks[k];
    }

    /* ---------- 1.1 heartbeat ----------
       A phone that closes the app or loses signal often never fires 'close'. Every 3 s we ping
       everyone; a peer that pings (1.1+) but has been silent for 10 s is treated as gone.
       Peers on 1.0 never ping, so they are never dropped by mistake. */
    function beat() {
      if (!S) return;
      const now = Date.now();
      for (const k in L.conns) {
        const s = +k; rawTo(s, { t: 'ping' });
        if (!L.hb[s] || now - (L.seen[s] || now) < 10000) continue;
        L.hb[s] = 0; const c = L.conns[s]; delete L.conns[s]; try { c.close(); } catch (e) {}
        stopAudioFrom(s);
        if (isHost()) { const p = rosterEntry(s); if (p) p.online = false; persist(); broadcastRoster(); setStatus(Object.keys(L.conns).length ? 'open' : 'waiting'); }
        else { setStatus('reconnecting'); scheduleRetry(); }
      }
    }

    /* ---------- closing ---------- */
    function close(keepSession) {
      clearTimeout(L.retry); clearInterval(L.hbT); L.hbT = null;
      Object.keys(L.audio).forEach(s => stopAudioFrom(+s));
      for (const s in L.conns) { try { L.conns[s].close(); } catch (e) {} }
      L.conns = {};
      if (L.mic) { L.mic.getTracks().forEach(t => t.stop()); L.mic = null; }
      L.calls = {}; L.talking = false;
      try { if (L.peer) L.peer.destroy(); } catch (e) {}
      L.peer = null; if (!keepSession) S = null; setStatus('off');
    }

    return {
      host, join, resume, close, send, sendTo, emoji, isOpen, talk, setOpenMic, recStart, recStop,
      get status() { return L.status; }, get error() { return L.lastErr; }, get session() { return S; },
      get seat() { return S ? S.seat : null; }, get roster() { return S ? S.roster : []; },
      get micReady() { return !!L.mic; }, get talking() { return L.talking; }, get openMic() { return L.openMic; }, get recording() { return !!L.rec; },
      inviteURL: () => location.origin + location.pathname + '?join=' + (S ? S.code : ''),
      _L: L
    };
  }
  return { create, genCode, loadPeer };
})();

/* ---- core.js ---- */
/* =====================================================================
   FamilyNest core — shared engine helpers. Pure: no DOM. Runs in Node too.
   Every game registers GAMES[id] with the same interface:
     newGame(players, cfg, seed) → G        apply(G, seat, action) → {ok}
     legal(G) → [actions]                   view(G, seat) → V (only what that seat may know)
     ai(V or G, lvl) → action               DEF (default cfg), minP, maxP
   G holds its own random state (G.r), so  seed + actions  replays every state.
   ===================================================================== */
const GAMES = {};
const FC = (() => {
  function rnd(G) {                                       // mulberry32, state kept in the game
    let t = (G.r = (G.r + 0x6D2B79F5) >>> 0);
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  const die = G => 1 + Math.floor(rnd(G) * 6);
  const newSeed = () => { try { const a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] >>> 0; } catch (e) { return (Math.random() * 4294967296) >>> 0; } };
  function shuffle(G, a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd(G) * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function base(game, players, cfg, seed) {
    const n = players.length;
    return {
      game, cfg, seed: seed >>> 0, r: seed >>> 0, n: 0,
      players: players.map(p => ({ name: p.name || '', kind: p.kind || 'human', lvl: p.lvl == null ? 1 : p.lvl, av: p.av || 1, pe: p.pe == null ? -1 : p.pe, wins: p.wins || 0 })),
      turn: ((cfg.first || 0) % n + n) % n, over: false, winner: null, ev: [], evn: 0, acts: []
    };
  }
  function ev(G, o) { o.i = ++G.evn; G.ev.push(o); if (G.ev.length > 60) G.ev.splice(0, G.ev.length - 60); return o; }
  function apply(G, s, a) {
    const E = GAMES[G.game]; if (!E || G.over) return { ok: false };
    let r; try { r = E.apply(G, s, a); } catch (e) { r = { ok: false, err: String(e) }; }
    if (r && r.ok) { G.acts.push([s, a]); G.n++; }
    return r || { ok: false };
  }
  // the public part of a game: no random state, no seed, no move log (a guest must not predict the dice)
  function pub(G, extraHidden) {
    const V = {};
    for (const k in G) { if (k === 'r' || k === 'seed' || k === 'acts' || (extraHidden && extraHidden.includes(k))) continue; V[k] = G[k]; }
    return JSON.parse(JSON.stringify(V));
  }
  function view(G, seat) { const E = GAMES[G.game]; const V = E.view ? E.view(G, seat) : pub(G); V.me = seat; return V; }

/* =====================================================================
   Dominoes (double-six, 28 tiles) — 2–4 players. 7 tiles each with two
   players, 5 with three or four; the rest is the boneyard.
   On your turn put a tile on either end of the line so the numbers match.
   No tile fits → take from the boneyard one at a time until one fits; boneyard
   empty → pass. First to empty the hand wins; if nobody can move (blocked),
   the fewest pips in hand wins.

   boneyard only as a count. The computer reads only its own hand and the
   public table (it remembers which numbers a player was missing).

  ru_match: '<p>Every side of a card has <b>half a picture</b>. Drag a card to swap it and tap it to turn it. Wherever two cards touch, a whole picture must appear — same shape and colour, a top half with a bottom half. A matching side glows green ✅.</p><p>Stages start with squares, then triangles, then hexagons. 💡 puts one card in place (+5 s). Fastest wins.</p>',
  ru_buzz: '<p>Move a ring along a twisting wire from ▶ to 🏁 — <b>without touching the wire</b>. A touch buzzes ⚡ and costs a ❤️; run out of hearts and you are out. Every touch adds 2.5 s.</p><p>With a finger: drag anywhere and the ring moves with it (your finger never hides it). You can also tilt the phone. Every stage the wire gets longer and the ring smaller.</p>',
  ru_maze: '<p>Tilt the phone and the balls roll. Get <b>every ball into a hole</b> — on colour stages, each ball into its own colour. A ball already in a hole can roll out if you tilt too hard! A red hole ✕ sends the ball back to the start.</p><p>No tilt sensor (or on a computer): put a finger on the board and drag the way to tilt, or use the arrow keys.</p>',

  ru_bs: '<p>Each player has a sea with a secret fleet. First everyone places their ships (🔀 places them for you, drag to move, tap to turn).</p><p>Then take turns firing: tap a square in the other sea. 💦 = miss, 💥 = hit, and when the whole ship is hit — <b>it sinks</b> 🚢. Sink the whole fleet first to win.</p><ul><li>{again}</li><li>{touch}</li></ul><p>On one phone a "pass the phone" screen appears between turns so nobody sees your ships.</p>',

  ru_dom: '<p>28 tiles, each with two halves of 0 to 6 pips (or pictures). Two players get 7 tiles each, three or four get 5. The rest is the pile.</p><p>On your turn put a tile on one of the two ends of the line so the <b>touching numbers match</b>. A tile that fits both ends — tap it, then tap the glowing circle on the side you want.</p><p>Nothing fits? Take from the pile until something does (it happens by itself). Pile empty — pass. First to play all tiles wins 🏆. If nobody can play, the fewest pips in hand wins.</p>',

  ru_sl: '<p>Roll the die and move. Land at the foot of a <b>ladder</b> — climb up 🎉. Land on a <b>snake</b>\'s head — slide down 😱. First to reach <b>100</b> 👑 wins.</p><p>{bounce} {six}</p><p>In the jungle you climb vines, in space you ride a rocket 🚀 and fall into a black hole, and in candy land you slide on chocolate 🍫.</p>',
  ru_sl_bounce: 'You must land on 100 <b>exactly</b>. Go past it and you walk back the rest (and a snake there still bites).', ru_sl_nobounce: 'You must land on 100 exactly; a roll that is too big means you stay.', ru_sl_six: 'A 6 gives another roll.',
  ru_ludo: '<p>Each player has 4 tokens (2 in a quick game) in a coloured yard. Goal: go all the way round and get them all to the centre 🏠.</p><ul><li>{exit}</li><li>{extra} {three}</li><li>Land on someone else\'s token — <b>it goes back to its yard</b> 💥.</li><li>{safe}</li><li>{exact}</li></ul><p>On your turn roll, then tap the token to move (a tap near it, or on the square it will reach, counts).</p>',
  ru_ld_exit6: 'You need a <b>6</b> to bring a token out.', ru_ld_exit1: 'A token comes out on a 6 or a 1.', ru_ld_extra: 'Rolled a 6? <b>Roll again</b>.', ru_ld_three: 'Three 6s in a row — you lose the turn.', ru_ld_safe: 'No captures on ⭐ or on the coloured start squares.', ru_ld_nosafe: 'No safe squares — captures anywhere.', ru_ld_exact: 'You need the <b>exact number</b> to get home.', ru_ld_noexact: 'A bigger number also gets you home.',
  ru_c4: '<p>Take turns dropping a disc into a column. It falls to the bottom. Make <b>four in a row</b> — across, up or diagonally — to win. A full board with no four is a draw.</p><p>A tap anywhere in a column drops there. 💡 shows a good column.</p>',
  ru_ttt: '<p>✕ and ◯ take turns. On 3×3 you need <b>three in a row</b>; on 6×6 — four; on 9×9 — five. Across, up or diagonally.</p><p>On big boards the first tap marks and a second tap (or ✓) plays — you can turn this off in Settings.</p>',
  ru_mem: '<p>All cards face down. On your turn flip two. <b>A pair?</b> It is yours and you go again ✨. Not a pair? They turn back and the turn passes. Most pairs wins.</p><p>You can also play alone and beat your record.</p>',
  ru_dots: '<p>On your turn draw one line between two dots. Close a box (its fourth side) and it is yours — <b>and you draw again</b>. When every box is closed, most boxes wins.</p><p>Tip: don\'t draw a box\'s third side — that gives it to your friend!</p>'

/* ---------- storage shim: localStorage with an in-memory fallback ---------- */
const LS = (() => {
  const mem = {}; let ok = true;
  try { localStorage.setItem(P + 't', '1'); localStorage.removeItem(P + 't'); } catch (e) { ok = false; }
  return {
    get(k, d) { try { const v = ok ? localStorage.getItem(P + k) : mem[k]; return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { const s = JSON.stringify(v); try { if (ok) localStorage.setItem(P + k, s); else mem[k] = s; return true; } catch (e) { toast(T('saveFail')); return false; } },
    del(k) { try { if (ok) localStorage.removeItem(P + k); else delete mem[k]; } catch (e) {} },
    keys() { const out = []; try { if (ok) for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k.startsWith(P)) out.push(k.slice(P.length)); } else out.push(...Object.keys(mem)); } catch (e) {} return out; }
  };
})();

let SCREEN = 'home', NAV = [];

function show(id, back) {
  if (!back && id !== SCREEN) { if (id === 'home') NAV = []; else { NAV.push(SCREEN); if (NAV.length > 12) NAV.shift(); } }
  if (id === 'game') NAV = NAV.filter(s => s === 'home' || s === 'online');      // back from a game: home (or the online room)
  $$('.scr').forEach(s => s.classList.toggle('on', s.id === id)); SCREEN = id; window.scrollTo(0, 0);
  if (typeof syncHistory === 'function') syncHistory();

}
let toastT = null;
function toast(msg, ms) { const t = $('#toast'); t.innerHTML = msg; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), ms || 2600); }
function overlay(html, cls) {
  const o = document.createElement('div'); o.className = 'ov ' + (cls || ''); o.innerHTML = '<div class="box">' + html + '</div>';
  // the tap that opened this window sends a late "ghost" click that would land inside it — swallow clicks for half a second
  const t0 = performance.now(), ghost = e => { if (performance.now() - t0 < 500) { e.preventDefault(); e.stopPropagation(); } else o.removeEventListener('click', ghost, true); };
  o.addEventListener('click', ghost, true);
  $('#ovs').appendChild(o); if (typeof syncHistory === 'function') syncHistory(); return o;
}
const closeOv = o => { if (o && o.parentNode) o.parentNode.removeChild(o); };
const anyOv = () => $('#ovs').children.length > 0;

function confirmBox(msg, yes, cb) {

  o.querySelector('[data-n]').onclick = () => closeOv(o);
  o.querySelector('[data-y]').onclick = () => { closeOv(o); cb(); };
}

/* ---------- the phone's back button: one step back inside the app, never out by surprise ----------
   A "guard" entry stays in the history (except for the 2 seconds after "press again to exit"). */
const HIST = { guard: false, ignore: 0 }; let exitArm = 0;
function syncHistory() {
  const need = !exitArm;
  try { if (need && !HIST.guard) { history.pushState({ fn: 1 }, ''); HIST.guard = true; } else if (!need && HIST.guard) { HIST.guard = false; HIST.ignore++; history.back(); } } catch (e) {}
}
function goBack() {
  const to = NAV.pop() || 'home';
  if (SCREEN === 'game' && CUR) { clearTimeout(CUR.botT); const el = $('#board'); if (el && el._run) { if (el._run.tone) el._run.tone.stop(); el._run = null; } }   // a run left by "back" is simply dropped (start again on return)
  closeAllOv();
  if (to === 'home') renderHome(); else if (to === 'online') renderNet(); else if (to === 'settings') renderSettings(); else if (to === 'stats') renderStats(); else if (to === 'replays') renderReplays();
  show(to, true); if (typeof renderBubbles === 'function') renderBubbles();
}
addEventListener('popstate', () => {
  if (HIST.ignore > 0) { HIST.ignore--; return; }
  HIST.guard = false;
  const top = $('#ovs').lastElementChild;
  if (top && top.classList.contains('curtain')) goBack();                 // "pass the phone": back leaves the game, it never uncovers it
  else if (top) { if (top.querySelector('.guide')) { ST.guided = true; saveST(); } top.remove(); }
  else if (SCREEN !== 'home') goBack();
  else { toast(T('pressAgainExit'), 2000); exitArm = setTimeout(() => { exitArm = 0; syncHistory(); }, 2000); }
  syncHistory();
});

let AC = null;
function beep(kind) {

    if (AC.state === 'suspended') AC.resume();
    const t = AC.currentTime;
    const tone = (f, d, type, v, at, f2) => { const o = AC.createOscillator(); o.type = type || 'sine'; o.frequency.setValueAtTime(f, t + (at || 0)); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + (at || 0) + d); const g = AC.createGain(); g.gain.setValueAtTime(v || .12, t + (at || 0)); g.gain.exponentialRampToValueAtTime(.0001, t + (at || 0) + d); o.connect(g); g.connect(AC.destination); o.start(t + (at || 0)); o.stop(t + (at || 0) + d + .02); };
    const click = (at, vol, f) => { const n = AC.createBuffer(1, AC.sampleRate * .03 | 0, AC.sampleRate), d = n.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 4); const s = AC.createBufferSource(); s.buffer = n; const b = AC.createBiquadFilter(); b.type = 'bandpass'; b.frequency.value = f || 1800; b.Q.value = 2; const g = AC.createGain(); g.gain.value = vol; s.connect(b); b.connect(g); g.connect(AC.destination); s.start(t + at); };
    switch (kind) {
      case 'dice': for (let i = 0; i < 7; i++) click(i * .05 + Math.random() * .02, .5 + Math.random() * .2, 1500 + Math.random() * 900); break;
      case 'hop': tone(520 + Math.random() * 60, .07, 'triangle', .09, 0, 760); break;
      case 'ladder': [523, 587, 659, 784, 880, 1047].forEach((f, i) => tone(f, .12, 'triangle', .1, i * .08)); break;
      case 'snake': tone(900, .75, 'sine', .12, 0, 160); tone(450, .75, 'triangle', .05, .02, 90); break;
      case 'drop': tone(220, .1, 'sine', .2, 0, 110); click(.0, .35, 600); break;
      case 'place': tone(660, .08, 'sine', .14, 0, 990); break;
      case 'flip': click(0, .35, 2600); tone(1200, .05, 'sine', .04, .01); break;
      case 'match': [784, 1047, 1319].forEach((f, i) => tone(f, .18, 'sine', .11, i * .07)); break;
      case 'miss': tone(330, .16, 'triangle', .08, 0, 260); break;
      case 'line': tone(900, .05, 'square', .04); break;
      case 'box': [659, 988].forEach((f, i) => tone(f, .14, 'triangle', .1, i * .06)); break;
      case 'cap': tone(180, .3, 'square', .07, 0, 620); tone(620, .2, 'sine', .08, .12, 300); break;
      case 'home': [523, 659, 784, 1047].forEach((f, i) => tone(f, .15, 'sine', .11, i * .06)); break;
      case 'six': [1047, 1319, 1568].forEach((f, i) => tone(f, .1, 'sine', .08, i * .05)); break;
      case 'turn': tone(880, .12, 'sine', .08); tone(1175, .14, 'sine', .07, .1); break;
      case 'win': [392, 523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, .32, 'triangle', .13, i * .1)); break;
      case 'lose': [392, 330, 262].forEach((f, i) => tone(f, .3, 'sine', .12, i * .14)); break;
      case 'draw': [523, 523, 659].forEach((f, i) => tone(f, .2, 'sine', .1, i * .12)); break;
      case 'err': tone(180, .15, 'square', .06); break;
      case 'whoosh': tone(1400, .38, 'sine', .05, 0, 300); break;
      case 'splash': for (let i = 0; i < 5; i++) click(i * .04, .3, 900 + i * 300); tone(600, .25, 'sine', .05, .02, 200); break;
      case 'boom': click(0, .9, 120); click(.03, .8, 220); tone(110, .45, 'sawtooth', .1, 0, 40); break;

}

/* ---------- talking characters ---------- */
let talkUntil = 0;
function say(V, s, key, force) {
  if (!ST.taunts || FAST || !V || !V.players[s] || V.players[s].kind !== 'bot') return false;
  if (!force && (Date.now() < talkUntil || Math.random() > 0.6)) return false;
  const list = T(key).split('|'); if (!list[0] || list[0] === key) return false;
  bubble(s, esc(list[Math.floor(Math.random() * list.length)]), 'talk', 2800); talkUntil = Date.now() + 2300; return true;
}
const botSeats = (V, not) => V.players.map((p, s) => p.kind === 'bot' && s !== not ? s : -1).filter(s => s >= 0);
const someBot = (V, not) => { const b = botSeats(V, not); return b.length ? b[Math.floor(Math.random() * b.length)] : -1; };

// reactions to what just happened (after its animation)
function react(V, evs) {
  if (!ST.taunts || FAST) return;
  for (const e of evs) {
    const s = e.s, bot = isBotSeat(V, s);
    if (e.e === 'down') { if (bot) say(V, s, 'tk_snakeMe'); else { const b = someBot(V, s); if (b >= 0) say(V, b, 'tk_snakeYou'); } }
    else if (e.e === 'up') { if (bot) say(V, s, 'tk_ladderMe'); else { const b = someBot(V, s); if (b >= 0) say(V, b, 'tk_ladderYou'); } }
    else if (e.e === 'cap') { if (isBotSeat(V, e.by)) say(V, e.by, 'tk_capMe', true); else if (bot) say(V, s, 'tk_capped', true); }
    else if (e.e === 'home' && bot) say(V, s, 'tk_home');
    else if (e.e === 'three6' && bot) say(V, s, 'tk_three6', true);
    else if (e.e === 'roll' && e.v === 6 && bot && V.game === 'ludo') say(V, s, 'tk_six');
    else if (e.e === 'match' && bot) say(V, s, 'tk_match');
    else if (e.e === 'line' && bot && e.boxes && e.boxes.length) say(V, s, 'tk_box');
    else if (e.e === 'shot' && e.r === 'sunk') { const o = 1 - s; if (bot) say(V, s, 'tk_bsSunk', true); else if (isBotSeat(V, o)) say(V, o, 'tk_bsLost', true); }
    else if (e.e === 'shot' && e.r === 'hit' && bot) say(V, s, 'tk_bsHit');
    else if (e.e === 'shot' && e.r === 'miss' && !bot && isBotSeat(V, 1 - s)) say(V, 1 - s, 'tk_bsMissYou');
    else if (e.e === 'draw' && bot && V.game === 'dom') say(V, s, 'tk_domDraw');
    else if (e.e === 'play' && bot && e.left === 1) say(V, s, 'tk_domLast', true);
  }
}

function thinkTalk(V) { if (['c4', 'ttt', 'dots', 'bs', 'dom'].includes(V.game) && Math.random() < 0.18) say(V, V.turn, 'tk_think'); }
function endTalk(V) {

  else if (isBotSeat(V, w)) say(V, w, 'tk_win', true);

}

/* ---- online.js ---- */
/* =====================================================================
   FamilyNest — online over NestLink 1.1 (one family room, any of the games)
   The host owns the game and sends every guest only its own view (sendTo).
   Guests send intents; the host checks them and applies. Computers in the room
   run on the host. A player who is offline for 30 s is covered by the computer.
   ===================================================================== */
let LINK = null;
let NET = LS.get('net', null);          // {role, sess, gid, map, bots, bpe, game, cfgs, lobby, wins, first, G (host), V (guest)}
let netSaveT = null;

  LS.set('net', NET);
}
const saveNetSoon = () => { clearTimeout(netSaveT); netSaveT = setTimeout(saveNet, 250); };

// the roster name carries the chosen animal: "name\u0001NN"

  const p = CUR.G.players[gs]; if (!p || p.kind !== 'human') return false;
  const L = linkOf(gs); if (L == null) return false;

}, 2000);

function netJoin(code) {
  code = (code || '').trim().toUpperCase();
  if (!/^[A-Z0-9]{5}$/.test(code)) { toast(T('badCode')); return; }
  if (!ST.name) { toast(T('nameFirst')); $('#netName') && $('#netName').focus(); return; }
  netInit(); if (CUR && CUR.mode === 'net') CUR = null;
  NET = { role: 'guest', sess: null, gid: null, map: {}, lobby: null, V: null };
  LINK.join(code); refreshNetUI();
}
// start (or restart) with everyone in the room right now
function netStart(rematch) {
  const E = GAMES[NET.game], list = lobbyList(true), nh = list.filter(x => x.kind === 'human').length;
  if (nh < 2) { toast(T('needFriend')); return; }
  if (nh > E.maxP) { toast(T('tooMany', { n: E.maxP })); return; }
  let use = list.slice(0, E.maxP);
  if (use.length < E.minP) { toast(T('needFriend')); return; }
  if (rematch && CUR && CUR.G) CUR.G.players.forEach((p, s) => { const L = linkOf(s); NET.wins[p.kind === 'bot' ? 'b' + p.pe : 'h' + L] = p.wins + (CUR.G.winner === s ? 1 : 0); });
  if (!rematch) NET.wins = {};
  NET.map = {}; use.forEach((x, i) => { if (x.kind === 'human') NET.map[x.link] = i; });
  const lv = levelsOf(NET.game, netCfg(), use.length).map(l => l[0]);
  const players = use.map(x => ({ name: x.name, kind: x.kind, lvl: x.kind === 'bot' ? (lv.includes(x.lvl) ? x.lvl : lv[lv.length - 1]) : 1, av: x.av, pe: x.kind === 'bot' ? x.pe : -1, wins: NET.wins[x.kind === 'bot' ? 'b' + x.pe : 'h' + x.link] || 0 }));
  NET.first = rematch ? (NET.first + 1) % use.length : 0;
  const G = E.newGame(players, Object.assign({}, netCfg(), { first: NET.first }), FC.newSeed());
  NET.gid = 'n' + Date.now().toString(36); NET.offSince = {};
  newCur('net', G, { id: NET.gid });
  closeAllOv(); show('game'); lobbyChanged(); after();
  if (rematch) toast(T('newGameN', { n: use.length }));
}
function pushViews() {
  if (!LINK || !CUR || !CUR.G) return;
  const offl = [], autoL = [];
  CUR.G.players.forEach((p, s) => { const ni = netInfo(s); if (ni && !ni.online) offl.push(s); if (autoSeat(s)) autoL.push(s); });
  for (const p of LINK.roster) {
    if (p.seat === 0) continue;
    const gs = gameSeatOf(p.seat);
    LINK.sendTo(p.seat, { type: 'view', gid: CUR.id, lk: NET.map, offl, autoL, V: FC.view(CUR.G, gs) });
  }
  compact('view'); saveNetSoon();
}

/* ---------- messages ---------- */
function onNetMsg(d, from) {
  if (!d || !NET) return;
  if (hostSide()) {
    if (d.type === 'act' && CUR && CUR.mode === 'net' && CUR.G) {
      const gs = gameSeatOf(from); if (d.gid !== CUR.id || gs < 0 || (GAMES[CUR.G.game].sim ? !!CUR.G.res[gs] : CUR.G.turn !== gs)) { pushViews(); return; }
      const r = FC.apply(CUR.G, gs, d.a || {});
      if (!r.ok) { pushViews(); return; }
      after();
    }
    return;
  }
  // guest
  if (d.type === 'lobby') { NET.lobby = d.lobby; saveNetSoon(); refreshNetUI(); return; }
  if (d.type === 'view') {
    NET.gid = d.gid; NET.map = d.lk || {};
    if (!CUR || CUR.mode !== 'net' || CUR.id !== d.gid) {
      const fresh = !!(CUR && CUR.mode === 'net');           // the host started a new game
      newCur('net', null, { host: false, id: d.gid, V: d.V });
      if (SCREEN === 'online' || SCREEN === 'game') { closeAllOv(); show('game'); }
      else if (fresh) toast(T('hostNewGame'), 4000);
    }
    CUR.V = d.V; CUR.pending = false; CUR.lk = d.lk; CUR.offl = d.offl || []; CUR.autoL = d.autoL || []; NET.V = d.V; saveNetSoon();
    if (SCREEN === 'game') render();
    return;
  }
  if (d.type === 'rep') { addReplay(Object.assign({}, d.rec, { me: CUR && CUR.V ? CUR.V.me : -1 })); return; }
  if (d.type === 'bye') { toast(T('hostLeft'), 4000); netLeave(false); if (SCREEN === 'game' || SCREEN === 'online') { closeAllOv(); show('home'); renderHome(); } }
}
function netLeave(sayBye) {
  const L = LINK;
  if (L && sayBye && hostSide()) { L.send({ type: 'bye' }); setTimeout(() => L.close(), 400); } else if (L) L.close();
  LINK = null; NET = null; LS.del('net');
  if (CUR && CUR.mode === 'net') CUR = null;
}
function netResume() {
  if (!NET || !NET.sess) return false;
  netInit(); LINK.resume(NET.sess);
  if (NET.role === 'host' && NET.G) { newCur('net', NET.G, { id: NET.gid }); closeAllOv(); show('game'); after(); }
  else if (NET.role === 'guest' && NET.V) { newCur('net', null, { host: false, id: NET.gid, V: NET.V }); closeAllOv(); show('game'); render(); }
  else { show('online'); renderNet(); }
  return true;
}
